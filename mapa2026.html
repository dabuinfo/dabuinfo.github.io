        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@700&display=swap');

        html, body, #map {
            width: 100%; height: 100%; margin: 0; padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            overflow: hidden; background: #0d1117;
        }

        .top-nav-panel {
            position: absolute; top: 12px; left: 10px; right: 10px; max-width: 540px; margin: 0 auto; z-index: 2000;
            background: rgba(18, 24, 38, 0.96); backdrop-filter: blur(10px);
            padding: 10px 14px; border-radius: 12px; box-shadow: 0 6px 25px rgba(0, 0, 0, 0.65);
            border: 1px solid #2d3748; box-sizing: border-box;
        }

        .header-row {
            display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
        }

        .header-title {
            color: #ffffff; font-size: 13px; font-weight: 800; display: flex; align-items: center; gap: 8px;
        }

        .badge-de {
            background: rgba(46, 204, 113, 0.15); border: 1px solid rgba(46, 204, 113, 0.4);
            color: #2ecc71; font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px;
            font-family: 'Space Mono', monospace;
        }

        .select-week {
            width: 100%; padding: 8px 12px; font-size: 13px; font-weight: 700; color: #f3f4f6;
            background: #1e293b; border: 1px solid #475569; border-radius: 8px; outline: none;
            margin-bottom: 8px; cursor: pointer;
        }

        .days-filter-row {
            display: flex; gap: 5px; justify-content: space-between;
        }

        .day-btn {
            flex: 1; padding: 6px 2px; font-size: 11px; font-weight: 700; text-align: center;
            border: none; border-radius: 6px; color: white; cursor: pointer; user-select: none;
            transition: all 0.2s ease;
        }

        .day-btn.inactive { background: #374151 !important; color: #9ca3af; opacity: 0.45; }

        .region-pin {
            border-radius: 50%; width: 32px; height: 32px; text-align: center; line-height: 32px;
            color: #ffffff; font-size: 13px; font-weight: 800; box-shadow: 0 3px 8px rgba(0,0,0,0.5);
            border: 2px solid #ffffff; transition: transform 0.2s ease; cursor: pointer;
        }
        .region-pin:hover { transform: scale(1.15); }

        .leaflet-popup-content-wrapper {
            background: #181818 !important; color: #e2e8f0 !important;
            padding: 0; overflow: hidden; border-radius: 10px; border: 1px solid #333;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        .leaflet-popup-content { margin: 0 !important; line-height: 1.4; }

        .popup-action-btn {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            text-align: center; padding: 8px 10px; border-radius: 6px; text-decoration: none;
            font-weight: 700; font-size: 12px; transition: filter 0.2s ease; box-sizing: border-box;
        }
        .popup-action-btn:hover { filter: brightness(1.12); }

        .btn-week-pack {
            background: linear-gradient(90deg, #2ecc71 0%, #27ae60 100%);
            color: #000 !important;
        }

        .btn-day-single {
            background: #242424; color: #38bdf8 !important;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }
        .btn-day-single:hover { background: #2f2f2f; }

        .bottom-summary-box {
            position: absolute; bottom: 25px; left: 10px; z-index: 1000;
            background: rgba(18, 24, 38, 0.94); backdrop-filter: blur(8px);
            padding: 8px 14px; border-radius: 8px; border: 1px solid #2d3748;
            color: #cbd5e1; font-size: 12px; font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }
    </style>

    </div>

            "usingen": [50.3344, 8.5367], "viersen": [51.2558, 6.3917], "voerde": [51.5989, 6.6853],
            "vulkaneifel": [50.2500, 6.8333], "walldorf-mörfelden": [49.9889, 8.5708], "weeze": [51.6264, 6.1956],
            "wehrheim": [50.3033, 8.5722], "weilerswist": [50.7606, 6.8367], "weilrod": [50.3167, 8.4167],
            "werdohl": [51.2589, 7.7619], "werra-meissner": [51.2167, 9.9333], "wesseling": [50.8258, 6.9744],
            "westerwald": [50.4350, 7.8286], "wiesbaden-naurod": [50.1306, 8.3039], "wolfsburg": [52.4227, 10.7865],
            "wülfrath": [51.2825, 7.0375], "wuppertal": [51.2562, 7.1508], "xanten": [51.6617, 6.4528],
            "zollernalb": [48.2725, 8.9567], "zülpich": [50.6908, 6.6492]
        };

        // CENTROIDY LANDÓW JAKO INTELIGENTNY FALLBACK (ŻADNYCH LOSOWYCH PUNKTÓW)
        const CENTROIDY_LANDOW = {
            'Baden-Württemberg': [48.6616, 9.3501],
            'Bayern': [48.7904, 11.4979],
            'Berlin': [52.5200, 13.4050],
            'Brandenburg': [52.4125, 12.5316],
            'Hessen': [50.6521, 9.1624],
            'Niedersachsen': [52.6367, 9.8451],
            'Nordrhein-Westfalen': [51.4332, 7.6616],
            'Rheinland-Pfalz': [49.9130, 7.4500],
            'Sachsen': [51.1045, 13.2017],
            'Sachsen-Anhalt': [51.9503, 11.6923],
            'Schleswig-Holstein': [54.2194, 9.6961]
        };

        const KOLORY_DNI = {
            0: "#2563eb", 1: "#16a34a", 2: "#ea580c", 3: "#9333ea", 4: "#dc2626", 5: "#059669"
        };

        const DNI_PL = ["Pon", "Wt", "Śr", "Czw", "Pt", "Sob"];
        const aktywneDni = { 0: true, 1: true, 2: true, 3: true, 4: true, 5: true };

        let daneTygodni = {};
        let aktualnyTydzien = null;

        const map = L.map('map', {
            center: [51.1657, 10.4515], zoom: 6.5, zoomControl: false, fullscreenControl: false
        });

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        if (document.fullscreenEnabled || document.webkitFullscreenEnabled) {
            try { L.control.fullscreen({ position: 'bottomright' }).addTo(map); } catch(e) {}
        }

        const streetLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri StreetMap', maxZoom: 18 }).addTo(map);
        const osmLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: 'OpenStreetMap', maxZoom: 19 });
        const topoLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', { attribution: 'Esri TopoMap', maxZoom: 18 });

        L.control.layers({
            "Kolorowa (Esri Street)": streetLayer,
            "Standardowa (OpenStreetMap)": osmLayer,
            "Topograficzna (Teren)": topoLayer
        }, null, { position: 'bottomright' }).addTo(map);

        const clusterGroup = L.markerClusterGroup({ maxClusterRadius: 30, disableClusteringAtZoom: 9, chunkedLoading: true });
        map.addLayer(clusterGroup);

        function getMondayOfISOWeek(w, y) {
            const simple = new Date(y, 0, 1 + (w - 1) * 7);
            const dow = simple.getDay();
            const ISOweekStart = simple;
            if (dow <= 4)
                ISOweekStart.setDate(simple.getDate() - simple.getDay() + 1);
            else
                ISOweekStart.setDate(simple.getDate() + 8 - simple.getDay());
            return ISOweekStart;
        }

        function pobierzDaneZeSpisu() {
            var d = new Date();
            var month = String(d.getMonth() + 1).padStart(2, '0');
            var day = String(d.getDate()).padStart(2, '0');
            var dzisiaj = d.getFullYear() + month + day;
            var dynamicznyToken = "Dabu" + dzisiaj;

            fetch(API_URL + "?action=getAllAvailability&token=" + dynamicznyToken)
                .then(res => res.json())
                .then(data => {
                    if (data.status === "OK" && data.data) {
                        przetworzOdpowiedz(data.data);
                    } else {
                        console.warn("Brak danych w odpowiedzi API.");
                    }
                })
                .catch(err => {
                    console.error("Błąd pobierania bazy:", err);
                });
        }

        function przetworzOdpowiedz(rawMatrix) {
            daneTygodni = {};

            for (let w in rawMatrix) {
                let tydzienArr = rawMatrix[w];
                if (!tydzienArr || tydzienArr.length === 0) continue;

                let wNum = parseInt(w);
                if (isNaN(wNum)) continue;

                daneTygodni[wNum] = [];

                tydzienArr.forEach(item => {
                    let rName = typeof item === 'string' ? item : item.nazwa;
                    if (!rName) return;

                    let cleanKey = rName.toLowerCase().trim();
                    let land = (typeof item === 'object' && (item.land || item.Land)) 
                        ? item.land 
                        : (SPECIAL_REGIONS_LAND_MAP[cleanKey] || "Niemcy");

                    let datyStr = (typeof item === 'object' && (item.daty || item["DATA (PN-SOB)"])) ? (item.daty || item["DATA (PN-SOB)"]) : "";
                    let frakcjaStr = (typeof item === 'object' && (item.rodzaj || item["RODZAJ"])) ? (item.rodzaj || item["RODZAJ"]) : "Sperrmüll";

                    let dniSet = new Set();
                    if (datyStr && datyStr !== "-") {
                        let matches = datyStr.match(/\d{4}-\d{2}-\d{2}/g);
                        if (matches) {
                            matches.forEach(dStr => {
                                let parts = dStr.split('-');
                                let dObj = new Date(parts[0], parts[1] - 1, parts[2]);
                                let dayOfWeek = dObj.getDay(); 
                                let idx = dayOfWeek === 0 ? 6 : dayOfWeek - 1; 
                                if (idx <= 5) dniSet.add(idx);
                            });
                        }
                    }
                    if (dniSet.size === 0) {
                        [0, 1, 2, 3, 4].forEach(d => dniSet.add(d));
                    }

                    // Prawidłowe pobieranie koordynatów z bazy lub fallback do Landu
                    let coords = KOORDYNATY_CENTRA[cleanKey];
                    if (!coords) {
                        coords = CENTROIDY_LANDOW[land] || [51.1657, 10.4515];
                    }

                    daneTygodni[wNum].push({
                        rejon: rName,
                        land: land,
                        daty: datyStr,
                        frakcje: frakcjaStr,
                        dni: Array.from(dniSet).sort(),
                        lat: coords[0],
                        lon: coords[1]
                    });
                });
            }

            generujOpcjeTygodni();
            odswiezMape();
        }

        function generujOpcjeTygodni() {
            const selectEl = document.getElementById('weekSelect');
            selectEl.innerHTML = '';

            const dostepneTygodnie = Object.keys(daneTygodni).map(Number).sort((a,b) => a - b);

            if (dostepneTygodnie.length === 0) {
                selectEl.innerHTML = '<option value="">Brak zaplanowanych zbiórek w bazie</option>';
                return;
            }

            dostepneTygodnie.forEach((w, idx) => {
                const monday = getMondayOfISOWeek(w, 2026);
                const saturday = new Date(monday);
                saturday.setDate(monday.getDate() + 5);

                const mD = String(monday.getDate()).padStart(2, '0');
                const mM = String(monday.getMonth() + 1).padStart(2, '0');
                const sD = String(saturday.getDate()).padStart(2, '0');
                const sM = String(saturday.getMonth() + 1).padStart(2, '0');
                const sY = saturday.getFullYear();

                const opt = document.createElement('option');
                opt.value = w;
                opt.textContent = `Tydzień ${String(w).padStart(2, '0')} (${mD}.${mM} - ${sD}.${sM}.${sY}) — ${daneTygodni[w].length} rejonów`;
                
                if (idx === 0) opt.selected = true;
                selectEl.appendChild(opt);
            });

            aktualnyTydzien = dostepneTygodnie[0];
        }

        function odswiezMape() {
            clusterGroup.clearLayers();
            if (!aktualnyTydzien || !daneTygodni[aktualnyTydzien]) {
                document.getElementById('activeCount').textContent = "0";
                document.getElementById('statusCounter').textContent = "0 rejonów";
                return;
            }

            const listaRejonow = daneTygodni[aktualnyTydzien];
            const aktywneMarkery = [];
            let liczbaWidocznych = 0;

            listaRejonow.forEach(item => {
                const czyDzienAktywny = item.dni.some(d => aktywneDni[d]);
                if (!czyDzienAktywny) return;

                liczbaWidocznych++;
                const pierwszyDzien = item.dni.find(d => aktywneDni[d]) !== undefined ? item.dni.find(d => aktywneDni[d]) : item.dni[0];
                const markerColor = KOLORY_DNI[pierwszyDzien] || "#2563eb";

                const aktywneDniTekst = item.dni.map(d => `<span style="background:${KOLORY_DNI[d]}; color:#fff; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:bold; margin-right:3px;">${DNI_PL[d]}</span>`).join('');

                const icon = L.divIcon({
                    html: '<i class="fa-solid fa-truck"></i>',
                    className: 'region-pin',
                    iconSize: [32, 32],
                    iconAnchor: [16, 16],
                    popupAnchor: [0, -12]
                });

                const popupHtml = `
                    <div translate="no" class="notranslate" style="font-family: Arial, sans-serif; min-width: 270px; font-size: 13px;">
                        <div style="background-color: ${markerColor}; color: white; padding: 10px 14px;">
                            <strong style="font-size: 15px;">${item.rejon}</strong><br>
                            <span style="font-size: 11px; opacity: 0.95;">Land: ${item.land} &bull; Tydzień ${aktualnyTydzien}</span>
                        </div>
                        <div style="padding: 12px 14px; background: #1c1c1c; color: #f3f4f6;">
                            <div style="margin-bottom: 8px;">
                                <span style="font-size:11px; color:#9ca3af; text-transform:uppercase; font-weight:bold;">Dni zbiórek w tygodniu:</span><br>
                                <div style="margin-top: 4px;">${aktywneDniTekst}</div>
                            </div>
                            <p style="margin: 6px 0 3px 0;"><strong>Dostępne terminy:</strong><br><span style="color:#60a5fa; font-weight:600;">${item.daty ? item.daty.replace(/\n/g, ', ') : 'Weryfikowane pod zamówienie'}</span></p>
                            <p style="margin: 6px 0;"><strong>Frakcja:</strong> ${item.frakcje}</p>
                            
                            <div style="margin-top: 14px; padding-top: 10px; border-top: 1px solid #333; display: flex; flex-direction: column; gap: 8px;">
                                <a href="https://dabu-info.com/zestaw.html" target="_blank" rel="noopener noreferrer" class="popup-action-btn btn-week-pack">
                                    📦 Zamów Zestaw Tygodniowy
                                </a>
                                <a href="https://dabu-info.com/kalendarz.html" target="_blank" rel="noopener noreferrer" class="popup-action-btn btn-day-single">
                                    📅 Zamów Wybrany Dzień
                                </a>
                            </div>
                        </div>
                    </div>
                `;

                const marker = L.marker([item.lat, item.lon], { icon: icon });
                marker.bindPopup(popupHtml, { maxWidth: 320 });
                marker.bindTooltip(`<strong>${item.rejon}</strong> (${item.land})`, { sticky: true });

                marker.on('add', function() {
                    const el = marker.getElement();
                    if (el) el.style.backgroundColor = markerColor;
                });

                clusterGroup.addLayer(marker);
                aktywneMarkery.push(marker);
            });

            document.getElementById('activeCount').textContent = liczbaWidocznych;
            document.getElementById('statusCounter').textContent = `${liczbaWidocznych} rejonów`;

            if (aktywneMarkery.length > 0) {
                const groupBounds = L.featureGroup(aktywneMarkery).getBounds();
                map.fitBounds(groupBounds, { padding: [85, 35], maxZoom: 10 });
            }
        }

        function zmienTydzien() {
            aktualnyTydzien = parseInt(document.getElementById('weekSelect').value);
            odswiezMape();
        }

        function toggleDzien(dayIdx) {
            aktywneDni[dayIdx] = !aktywneDni[dayIdx];
            const btn = document.getElementById(`btn-${dayIdx}`);
            if (aktywneDni[dayIdx]) {
                btn.classList.remove('inactive');
            } else {
                btn.classList.add('inactive');
            }
            odswiezMape();
        }

        pobierzDaneZeSpisu();
    </script>
