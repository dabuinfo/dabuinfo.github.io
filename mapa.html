    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
        }

        #dabuOSMMap {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .leaflet-container:focus,
        .leaflet-interactive:focus,
        svg:focus,
        path:focus {
            outline: none !important;
        }

        /* --- OBERES SUCH-PANEL --- */
        .floating-search-hub {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 24px);
            max-width: 500px;
            z-index: 1100;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-box-wrapper {
            background: rgba(18, 24, 38, 0.94);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 127, 0.35);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .dabu-search-input { 
            width: 100%; 
            padding: 11px 14px; 
            background: #111827;
            border: 1px solid #374151; 
            color: #fff; 
            font-size: 14.5px; 
            border-radius: 8px; 
            outline: none; 
            transition: all 0.2s;
        }
        .dabu-search-input:focus { 
            border-color: #00FF7F; 
            box-shadow: 0 0 10px rgba(0, 255, 127, 0.35);
            background: #0f172a;
        }

        .filters-quick-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .dabu-county-btn { 
            background: rgba(0, 255, 127, 0.15); 
            color: #00FF7F;
            border: 1px solid #00FF7F; 
            padding: 6px 11px; 
            border-radius: 6px; 
            font-size: 12px; 
            font-weight: 700;
            cursor: pointer; 
            transition: all 0.2s;
        }
        .dabu-county-btn:hover { 
            background: #00FF7F; 
            color: #000;
        }

        /* --- KREIS-SUCHLISTE --- */
        .counties-search-list {
            max-height: 0;
            opacity: 0;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 2px;
            background: rgba(18, 24, 38, 0.98);
            backdrop-filter: blur(14px);
            border-radius: 10px;
            border: 1px solid transparent;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.75);
            transition: max-height 0.3s ease, opacity 0.2s ease, border-color 0.2s ease, padding 0.2s ease;
            padding: 0 10px;
        }

        .counties-search-list.is-open {
            max-height: 250px;
            opacity: 1;
            padding: 8px 10px;
            border-color: rgba(0, 255, 127, 0.4);
        }

        .county-search-item {
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13.5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #e2e8f0;
            transition: background 0.15s;
        }
        .county-search-item:hover {
            background: rgba(0, 255, 127, 0.15);
            color: #00FF7F;
        }

        /* --- MODALES FENSTER FÜR GEMEINDEN NACH KREIS-KLICK --- */
        .county-details-modal {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.95);
            width: 90%;
            max-width: 480px;
            max-height: 80vh;
            background: rgba(18, 24, 38, 0.98);
            backdrop-filter: blur(16px);
            border: 1px solid #00FF7F;
            border-radius: 14px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8);
            z-index: 1200;
            display: flex;
            flex-direction: column;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease-out;
        }

        .county-details-modal.is-active {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }

        .modal-header {
            padding: 14px 16px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 {
            margin: 0;
            font-size: 16px;
            color: #00FF7F;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .close-modal-btn {
            background: transparent;
            border: none;
            color: #94a3b8;
            font-size: 20px;
            cursor: pointer;
            line-height: 1;
        }
        .close-modal-btn:hover { color: #fff; }

        .modal-body {
            padding: 12px 16px;
            overflow-y: auto;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .modal-body::-webkit-scrollbar { width: 6px; }
        .modal-body::-webkit-scrollbar-thumb { background: #00FF7F; border-radius: 4px; }

        .municipality-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 7px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .municipality-row:hover {
            background: rgba(0, 255, 127, 0.08);
            border-color: rgba(0, 255, 127, 0.2);
        }

        .add-mun-btn {
            background: rgba(0, 255, 127, 0.15);
            color: #00FF7F;
            border: 1px solid #00FF7F;
            padding: 4px 9px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            transition: all 0.2s;
        }
        .add-mun-btn:hover {
            background: #00FF7F;
            color: #000;
        }
        .add-mun-btn.added {
            background: #ffd700;
            color: #000;
            border-color: #ffd700;
        }

        .modal-footer {
            padding: 12px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(11, 15, 25, 0.6);
        }

        .modal-sms-btn {
            background: #00FF7F;
            color: #000;
            font-weight: bold;
            border: none;
            padding: 9px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .modal-sms-btn:hover { background: #00cc66; }

        /* --- UNTERE LEISTE --- */
        .bottom-counter-container {
            position: absolute;
            bottom: 15px;
            left: 15px;
            z-index: 1000;
            pointer-events: none;
        }
        .map-counter-box {
            background: rgba(18, 24, 38, 0.94);
            backdrop-filter: blur(8px);
            padding: 7px 12px;
            border-radius: 8px;
            border: 1px solid #2d3748;
            color: #cbd5e1;
            font-size: 12.5px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            white-space: nowrap;
        }

        /* 3D STILE */
        .land-boundary-3d {
            filter: drop-shadow(0px 0px 3px rgba(0, 0, 0, 0.8)) drop-shadow(0px 0px 5px rgba(0, 255, 127, 0.45));
            cursor: pointer;
        }
        .land-boundary-3d:hover {
            filter: drop-shadow(0px 0px 6px rgba(0, 0, 0, 0.9)) drop-shadow(0px 0px 10px rgba(0, 255, 127, 0.9));
        }

        .user-loc-pin {
            background: #00c3ff;
            border: 2px solid #ffffff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            box-shadow: 0 0 12px #00c3ff;
            position: relative;
        }
    </style>
</head>
<body>

    <div id="dabuOSMMap"></div>

    <!-- OBERES PANEL -->
    <div class="floating-search-hub">
        <div class="search-box-wrapper">
            <input type="text" id="dabuRegionSearch" class="dabu-search-input" placeholder="🔍 Szukaj powiatu (np. Borken, Olpe, Gießen, Stade)..." onkeyup="filterCounties()" onfocus="openCountiesList()">
            
            <div class="filters-quick-row">
                <button class="dabu-county-btn" onclick="zoomGermany()">🇩🇪 Całe Niemcy</button>
                <button class="dabu-county-btn" style="background:#dc3545; color:#fff; border-color:#dc3545;" onclick="clearAllSelections()">🗑️ Wyczyść</button>
            </div>
        </div>

        <div class="counties-search-list" id="countiesSearchList"></div>
    </div>

    <!-- MODALES FENSTER FÜR GEMEINDEN NACH KREIS-KLICK -->
    <div class="county-details-modal" id="countyDetailsModal">
        <div class="modal-header">
            <h3 id="modalCountyTitle">📍 Powiat</h3>
            <button class="close-modal-btn" onclick="closeCountyModal()">✕</button>
        </div>
        <div class="modal-body" id="modalMunicipalitiesList"></div>
        <div class="modal-footer">
            <div id="modalSelectedCounter" style="font-size: 12px; color: #00FF7F;">Wybrano: 0</div>
            <button class="modal-sms-btn" onclick="sendSmsQuote()">💬 Wyślij zapytanie</button>
        </div>
    </div>

    <!-- ZÄHLER -->
    <div class="bottom-counter-container">
        <div class="map-counter-box">
            <span>Wybrane gminy do zapytania: <strong id="totalCartCount" style="color:#00FF7F;">0</strong></span>
        </div>
    </div>

    <script>
        // BAZA DANYCH POWIATÓW I ICH GMIN

            },

            },
            "Burgenlandkreis": {

            },
            "Altmarkkreis Salzwedel": {
                land: "Sachsen-Anhalt",
                center: [52.8494, 11.1506],
                municipalities: ["Apenburg-Winterfeld", "Arendsee (Altmark)", "Beetzendorf", "Dähre", "Diesdorf", "Gardelegen", "Jübar", "Kalbe (Milde)", "Klötze", "Kuhfelde", "Rohrberg", "Salzwedel", "Wallstawe"]
            },
            "Landkreis Lüneburg": {
                land: "Niedersachsen",
                center: [53.2452, 10.4089],
                municipalities: ["Adendorf", "Amelinghausen", "Amt Neuhaus", "Artlenburg", "Barendorf", "Bardowick", "Barnstedt", "Barum", "Betzendorf", "Bleckede", "Boitze", "Brietlingen", "Dahlem", "Dahlenburg", "Deutsch Evern", "Echem", "Embsen", "Handorf", "Hittbergen", "Hohnstorf (Elbe)", "Kirchgellersen", "Lüdersburg", "Lüneburg", "Mechtersen", "Melbeck", "Nahrendorf", "Neetze", "Oldendorf (Luhe)", "Radbruch", "Rehlingen", "Reinstorf", "Reppenstedt", "Rullstorf", "Scharnebeck", "Soderstorf", "Südergellersen", "Thomasburg", "Tosterglope", "Vastorf", "Vögelsen", "Wendisch Evern", "Westergellersen", "Wittorf"]
            },
            "Landkreis Harburg": {

                municipalities: ["Appel", "Asendorf", "Bendestorf", "Brackel", "Buchholz in der Nordheide", "Dohren", "Drage", "Drestedt", "Egestorf", "Eyendorf", "Garlstorf", "Garstedt", "Gödenstorf", "Halvesbostel", "Handeloh", "Hanstedt", "Harmstorf", "Heidenau", "Hollenstedt", "Jesteburg", "Kakenstorf", "Königsmoor", "Marschacht", "Marxen", "Neu Wulmstorf", "Otter", "Regesbostel", "Rosengarten", "Salzhausen", "Seevetal", "Tespe", "Toppenstedt", "Tostedt", "Undeloh", "Vierhöfen", "Welle", "Wenzendorf", "Winsen (Luhe)", "Wistedt", "Wulfsen"]
            },
            "Landkreis Stade": {
                land: "Niedersachsen",
                center: [53.6006, 9.4759],
                municipalities: ["Agathenburg", "Ahlerstedt", "Balje", "Bargstedt", "Bliedersdorf", "Brest", "Burweg", "Buxtehude", "Deinste", "Dollern", "Drochtersen", "Düdenbüttel", "Engelschoff", "Estorf", "Fredenbeck", "Freiburg (Elbe)", "Großenwörden", "Grünendeich", "Guderhandviertel", "Hammah", "Harsefeld", "Heinbockel", "Himmelpforten", "Hollern-Twielenfleth", "Horneburg", "Jork", "Kranenburg", "Krummendeich", "Kutenholz", "Mittelnkirchen", "Neuenkirchen", "Nottensdorf", "Oederquart", "Oldendorf", "Sauensiek", "Stade", "Steinkirchen", "Wischhafen"]
            }
        };

        let selectedMunicipalities = [];
        let currentCountyLayer = null;
        let userLocationMarker = null;

        const map = L.map('dabuOSMMap', { zoomControl: false }).setView([51.1657, 10.4515], 6);
        L.control.zoom({ position: 'topleft' }).addTo(map);

        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', { 
            attribution: 'Esri StreetMap', maxZoom: 18 
        }).addTo(map);

        // GEOLOKALISIERUNG
        const customControls = L.control({position: 'topright'});
        customControls.onAdd = function () {
            const container = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
            const locBtn = L.DomUtil.create('a', '', container);
            locBtn.innerHTML = '🎯'; locBtn.href = '#'; locBtn.title = 'Moja pozycja'; locBtn.style.fontSize = '16px';
            locBtn.style.lineHeight = '30px'; locBtn.style.textAlign = 'center'; locBtn.style.textDecoration = 'none';
            locBtn.onclick = function(e){
                e.preventDefault();
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(pos => {
                        const lat = pos.coords.latitude, lon = pos.coords.longitude;
                        if (userLocationMarker) map.removeLayer(userLocationMarker);
                        userLocationMarker = L.marker([lat, lon], {
                            icon: L.divIcon({ className: 'user-loc-pin', iconSize: [16, 16], iconAnchor: [8, 8] })
                        }).addTo(map);
                        map.flyTo([lat, lon], 10, { duration: 1.2 });
                    });
                }
            };
            return container;
        };
        customControls.addTo(map);

        // KREIS-GRENZEN LADEN & INTERAKTIV MACHEN
        fetch('https://raw.githubusercontent.com/isellsoap/deutschlandGeoJSON/main/4_kreise/4_niedrig.geo.json')
            .then(r => r.json())
            .then(geoData => {
                L.geoJSON(geoData, {
                    style: function (feature) {
                        const p = feature.properties || {};
                        const name = p.GEN || p.name || "";
                        const isAvailable = Object.keys(countyDatabase).some(k => k.toLowerCase().includes(name.toLowerCase()));
                        return {
                            color: isAvailable ? "#00FF7F" : "rgba(255,255,255,0.15)",
                            weight: isAvailable ? 1.8 : 0.8,
                            fillColor: isAvailable ? "#00FF7F" : "transparent",
                            fillOpacity: isAvailable ? 0.08 : 0,
                            className: isAvailable ? 'land-boundary-3d' : ''
                        };
                    },
                    onEachFeature: function (feature, layer) {
                        const p = feature.properties || {};
                        const name = p.GEN || p.name || "";
                        const matchedKey = Object.keys(countyDatabase).find(k => k.toLowerCase().includes(name.toLowerCase()));

                        if (matchedKey) {
                            layer.bindTooltip(`<b>Powiat: ${matchedKey}</b><br><small>Kliknij, aby wybrać gminy</small>`, { sticky: true });
                            layer.on('click', () => {
                                showCountyModal(matchedKey);
                                map.fitBounds(layer.getBounds(), { padding: [50, 50] });
                            });
                        }
                    }
                }).addTo(map);
            });

        // MODAL MIT GEMEINDEN ÖFFNEN
        function showCountyModal(countyName) {
            const data = countyDatabase[countyName];
            if (!data) return;

            document.getElementById('modalCountyTitle').innerHTML = `📍 ${countyName} <small style="font-size:12px; color:#94a3b8; font-weight:normal;">(${data.land})</small>`;
            const container = document.getElementById('modalMunicipalitiesList');
            container.innerHTML = '';

            data.municipalities.sort().forEach(mun => {
                const row = document.createElement('div');
                row.className = 'municipality-row';

                const isAdded = selectedMunicipalities.includes(mun);

                row.innerHTML = `
                    <span style="font-size:14px; font-weight:500;">${mun}</span>
                    <button class="add-mun-btn ${isAdded ? 'added' : ''}" onclick="toggleMunicipality('${mun.replace(/'/g, "\\'")}', this)">
                        ${isAdded ? '✓ Dodano' : '+ Dodaj'}
                    </button>
                `;
                container.appendChild(row);
            });

            document.getElementById('countyDetailsModal').classList.add('is-active');
            updateCartDisplays();
        }

        function closeCountyModal() {
            document.getElementById('countyDetailsModal').classList.remove('is-active');
        }

        function toggleMunicipality(name, btn) {
            if (selectedMunicipalities.includes(name)) {
                selectedMunicipalities = selectedMunicipalities.filter(m => m !== name);
                btn.classList.remove('added');
                btn.innerText = '+ Dodaj';
            } else {
                selectedMunicipalities.push(name);
                btn.classList.add('added');
                btn.innerText = '✓ Dodano';
            }
            updateCartDisplays();
        }

        function updateCartDisplays() {
            document.getElementById('totalCartCount').innerText = selectedMunicipalities.length;
            document.getElementById('modalSelectedCounter').innerText = `Wybrano gmin: ${selectedMunicipalities.length}`;
        }

        // SUCHE NACH KREISEN
        function openCountiesList() {
            document.getElementById('countiesSearchList').classList.add('is-open');
            filterCounties();
        }

        function filterCounties() {
            const query = document.getElementById('dabuRegionSearch').value.toLowerCase().trim();
            const list = document.getElementById('countiesSearchList');
            list.innerHTML = '';

            const matched = Object.keys(countyDatabase).filter(c => c.toLowerCase().includes(query) || countyDatabase[c].municipalities.some(m => m.toLowerCase().includes(query)));

            matched.forEach(c => {
                const item = document.createElement('div');
                item.className = 'county-search-item';
                item.innerHTML = `
                    <span><strong>${c}</strong> <small style="color:#94a3b8;">(${countyDatabase[c].land})</small></span>
                    <span style="font-size:11.5px; color:#00FF7F;">${countyDatabase[c].municipalities.length} gmin ›</span>
                `;
                item.onclick = () => {
                    showCountyModal(c);
                    list.classList.remove('is-open');
                    map.flyTo(countyDatabase[c].center, 9, { duration: 1 });
                };
                list.appendChild(item);
            });
        }

        function clearAllSelections() {
            selectedMunicipalities = [];
            document.getElementById('dabuRegionSearch').value = '';
            document.getElementById('countiesSearchList').classList.remove('is-open');
            closeCountyModal();
            updateCartDisplays();
            zoomGermany();
        }

        function zoomGermany() {
            map.flyTo([51.1657, 10.4515], 6, { duration: 1 });
        }

        map.on('click', () => {
            document.getElementById('countiesSearchList').classList.remove('is-open');
        });

        // SMS-ANFRAGE ABSENDEN
        function sendSmsQuote() {
            if (selectedMunicipalities.length === 0) {
                alert("Wybierz przynajmniej jedną gminę z listy.");
                return;
            }
            const phoneNumber = "+48600812820";
            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            const smsSeparator = isIOS ? "&" : "?";
            const message = `Dzień dobry, proszę o wycenę i terminy dla wybranych gmin: ${selectedMunicipalities.join(', ')}.`;
            window.location.href = `sms:${phoneNumber}${smsSeparator}body=${encodeURIComponent(message)}`;
        }
    </script>
</body>
</html>
