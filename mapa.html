    <style>
        * { box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
        }

        #dabuOSMMap {
            width: 100vw;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .leaflet-container:focus,
        .leaflet-interactive:focus,
        svg:focus,
        path:focus {
            outline: none !important;
        }

        /* --- PŁYWAJĄCY GÓRNY PANEL --- */
        .floating-search-hub {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 24px);
            max-width: 520px;
            z-index: 1100;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .search-box-wrapper {
            background: rgba(18, 24, 38, 0.94);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 255, 127, 0.35);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.65);
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .dabu-search-input { 
            width: 100%; 
            padding: 11px 14px; 
            background: #111827;
            border: 1px solid #374151; 
            color: #fff; 
            font-size: 14.5px; 
            border-radius: 8px; 
            outline: none; 
            transition: all 0.2s;
        }
        .dabu-search-input:focus { 
            border-color: #00FF7F; 
            box-shadow: 0 0 10px rgba(0, 255, 127, 0.35);
            background: #0f172a;
        }

        .filters-quick-row {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .dabu-county-btn { 
            background: rgba(0, 255, 127, 0.15); 
            color: #00FF7F;
            border: 1px solid #00FF7F; 
            padding: 6px 11px; 
            border-radius: 6px; 
            font-size: 12px; 
            font-weight: 700;
            cursor: pointer; 
            transition: all 0.2s;
        }
        .dabu-county-btn:hover { 
            background: #00FF7F; 
            color: #000;
        }

        /* --- ROZWIJANA LISTA REGIONÓW --- */
        .regions-scroll-box { 
            max-height: 0;
            opacity: 0;
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 2px; 
            background: rgba(18, 24, 38, 0.98);
            backdrop-filter: blur(14px);
            border-radius: 10px;
            border: 1px solid transparent;
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.75);
            transition: max-height 0.3s ease, opacity 0.2s ease, border-color 0.2s ease, padding 0.2s ease;
            padding: 0 10px;
        }

        .regions-scroll-box.is-open {
            max-height: min(48vh, 360px);
            opacity: 1;
            padding: 10px;
            border-color: rgba(0, 255, 127, 0.4);
        }

        .regions-scroll-box::-webkit-scrollbar { width: 6px; }
        .regions-scroll-box::-webkit-scrollbar-thumb { background: #00FF7F; border-radius: 4px; }

        .region-label { 
            display: flex; 
            align-items: center; 
            color: #cbd5e1; 
            cursor: pointer;
            padding: 6px 10px; 
            border-radius: 6px; 
            font-size: 13.5px; 
            transition: background 0.15s;
        }
        .region-label:hover { 
            background: rgba(0, 255, 127, 0.15); 
            color: #fff;
        }
        .region-chk { 
            appearance: none; 
            width: 18px; 
            height: 18px; 
            border: 2px solid #555;
            border-radius: 4px; 
            margin-right: 10px; 
            background: #222; 
            position: relative; 
            cursor: pointer;
            flex-shrink: 0;
        }
        .region-chk:checked { 
            background-color: #00FF7F; 
            border-color: #00FF7F;
        }
        .region-chk:checked::after { 
            content: ''; 
            position: absolute; 
            left: 5px; 
            top: 2px; 
            width: 4px;
            height: 8px; 
            border: solid #000; 
            border-width: 0 2px 2px 0; 
            transform: rotate(45deg);
        }
        .add-list-btn {
            background: rgba(0, 255, 127, 0.15);
            color: #00FF7F;
            border: 1px solid #00FF7F;
            padding: 2px 7px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            margin-left: auto;
            transition: all 0.2s;
        }
        .add-list-btn:hover {
            background: #00FF7F;
            color: #000;
        }

        /* --- BLOK ZAPYTANIA SMS NA DOLE ROZWIJANEJ LISTY --- */
        .list-sms-dock {
            margin-top: 8px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            background: rgba(11, 15, 25, 0.85);
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid rgba(0, 255, 127, 0.3);
        }
        .list-sms-dock-btn {
            background: #00FF7F;
            color: #000;
            font-weight: bold;
            border: none;
            padding: 7px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12.5px;
            white-space: nowrap;
            transition: background 0.2s;
        }
        .list-sms-dock-btn:hover { background: #00cc66; }

        /* --- LICZNIK NA DOLE EKRANU --- */
        .bottom-counter-container {
            position: absolute;
            bottom: 15px;
            left: 15px;
            z-index: 1000;
            pointer-events: none;
        }
        .map-counter-box {
            background: rgba(18, 24, 38, 0.94);
            backdrop-filter: blur(8px);
            padding: 7px 12px;
            border-radius: 8px;
            border: 1px solid #2d3748;
            color: #cbd5e1;
            font-size: 12.5px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            white-space: nowrap;
        }

        /* --- KONTURY LANDÓW --- */
        .land-boundary-3d {
            filter: drop-shadow(0px 0px 3px rgba(0, 0, 0, 0.8)) drop-shadow(0px 0px 5px rgba(0, 255, 127, 0.45));
            transition: stroke-width 0.2s, stroke 0.2s;
            cursor: pointer;
        }
        .land-boundary-3d:hover {
            filter: drop-shadow(0px 0px 6px rgba(0, 0, 0, 0.9)) drop-shadow(0px 0px 10px rgba(0, 255, 127, 0.9));
        }

        .custom-leaflet-tooltip { 
            background: #111; 
            color: #fff; 
            border: 1px solid #00FF7F; 
            border-radius: 6px;
            padding: 8px; 
            font-size: 13.5px; 
        }

        .treasure-pin {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: 2px solid #ffffff;
            border-radius: 50% 50% 50% 0;
            transform: rotate(-45deg);
            width: 24px;
            height: 24px;
            box-shadow: 0 4px 10px rgba(255, 215, 0, 0.6);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .treasure-pin::after {
            content: '💎';
            font-size: 12px;
            transform: rotate(45deg);
        }

        .user-loc-pin {
            background: #00c3ff;
            border: 2px solid #ffffff;
            border-radius: 50%;
            width: 16px;
            height: 16px;
            box-shadow: 0 0 12px #00c3ff;
            position: relative;
        }
        .user-loc-pin::before {
            content: '';
            position: absolute;
            top: -6px; left: -6px; right: -6px; bottom: -6px;
            border-radius: 50%;
            border: 2px solid #00c3ff;
            animation: user-loc-pulse 1.6s infinite ease-out;
        }
        @keyframes user-loc-pulse {
            0% { transform: scale(0.6); opacity: 1; }
            100% { transform: scale(2.2); opacity: 0; }
        }

        .pulse-treasure { position: relative; }
        .pulse-treasure::before {
            content: '';
            position: absolute;
            top: -8px; left: -8px; right: -8px; bottom: -8px;
            border: 2px solid #ffd700;
            border-radius: 50% 50% 50% 0;
            animation: pulse-ring 1.2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }

        .dabu-order-popup {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            background: rgba(0, 255, 127, 0.95);
            color: #000;
            padding: 16px 30px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 15px rgba(0, 255, 127, 0.6);
            z-index: 999999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.25s ease-out;
        }
        .dabu-order-popup.show {
            opacity: 1;
            visibility: visible;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>

        function locateUser() {
            if (!navigator.geolocation) {
                alert("Geolokalizacja nie jest wspierana przez Twoją przeglądarkę.");
                return;
            }
            navigator.geolocation.getCurrentPosition(
                function(pos) {
                    var lat = pos.coords.latitude;
                    var lon = pos.coords.longitude;
                    
                    if (userLocationMarker) {
                        map.removeLayer(userLocationMarker);
                    }

                    var userIcon = L.divIcon({
                        className: '',
                        html: '<div class="user-loc-pin"></div>',
                        iconSize: [16, 16],
                        iconAnchor: [8, 8]
                    });

                    userLocationMarker = L.marker([lat, lon], { icon: userIcon }).addTo(map);
                    userLocationMarker.bindPopup("<b>📍 Twoja lokalizacja</b>").openPopup();
                    map.flyTo([lat, lon], 10, { duration: 1.2 });
                },
                function(err) {
                    alert("Nie udało się pobrać Twojej lokalizacji: " + err.message);
                },
                { enableHighAccuracy: true, timeout: 8000 }
            );
        }

               let geoLayer = L.geoJSON(geoData, {
                  style: function(feature) {
                      let name = normalizeLandName(feature.properties.NAME_1 || feature.properties.name || feature.properties.GEN);
                      let active = landMap[name] && landMap[name].length > 0;
                      let regionColor = landColors[name] || "#00FF7F"; 
                      return { 
                          color: active ? regionColor : "#4b5563", 
                          weight: active ? 2.5 : 1, 
                          dashArray: active ? null : '3, 4',
                          fillColor: active ? regionColor : "transparent", 
                          fillOpacity: active ? 0.05 : 0.0,
                          className: active ? 'land-boundary-3d' : ''
                      };
                  },
                  onEachFeature: function (feature, layer) {
                      let name = normalizeLandName(feature.properties.NAME_1 || feature.properties.name || feature.properties.GEN);
                      let count = landMap[name] ? landMap[name].length : 0;
                      let regionColor = landColors[name] || "#00FF7F";

                      layer.bindTooltip("<b>"+name+"</b><br>"+(count > 0 ? "Rejony: "+count : "Brak rejonów"), {sticky: true, className: 'custom-leaflet-tooltip'});
                      
                      layer.on('mouseover', function(e) {
                          if (landMap[name] && landMap[name].length > 0) {
                              this.setStyle({
                                  weight: 4,
                                  fillOpacity: 0.18,
                                  color: '#ffffff'
                              });
                              if (!L.Browser.ie && !L.Browser.opera && !L.Browser.edge) {
                                  this.bringToFront();
                              }
                          }
                      });

                      layer.on('mouseout', function(e) {
                          let active = landMap[name] && landMap[name].length > 0;
                          this.setStyle({
                              color: active ? regionColor : "#4b5563",
                              weight: active ? 2.5 : 1,
                              fillOpacity: active ? 0.05 : 0.0
                          });
                      });

                      layer.on('click', () => selectLand(name));
                  }
               }).addTo(landFrontLayer);

               }).addTo(map);
            });
            
        function drawSingleRegionOnMap(name, info) {
            if (!regionCoords[name] || markerMapElements[name]) return;
            
            let popupContent = `<b>${name}</b><br><small>${info}</small><br><br>` +
                `<button onclick="sendSingleRegionInquiry('${name.replace(/'/g, "\\'")}')" style="display:block; width:100%; text-align:center; padding:7px 10px; background:linear-gradient(135deg, #ffd700, #ff8c00); color:#00FF7F; border:none; border-radius:4px; font-weight:bold; font-size:13px; cursor:pointer; margin-bottom:6px;">💬 Wyślij zapytanie o ten rejon</button>` +
                `<button onclick="addToCart('${name.replace(/'/g, "\\'")}')" style="display:block; width:100%; text-align:center; padding:6px 10px; background:rgba(0,255,127,0.2); color:#00FF7F; border:1px solid #00FF7F; border-radius:4px; font-weight:bold; font-size:12px; cursor:pointer;">➕ Dodaj do listy zapytania</button>`;
            
            let treasureIcon = L.divIcon({
                className: '',
                html: '<div class="treasure-pin"></div>',
                iconSize: [24, 24],
                iconAnchor: [12, 12],
                popupAnchor: [0, -12]
            });

            let marker = L.marker(regionCoords[name], { icon: treasureIcon }).bindPopup(popupContent);
            marker.addTo(markersLayer);
            markerMapElements[name] = marker; 

            if (name === "Neustadt an der Waldnaab") {
                let neustadtPolygon = [[49.863, 11.855], [49.895, 11.965], [49.876, 12.155], [49.899, 12.355], [49.799, 12.445], [49.665, 12.515], [49.632, 12.355], [49.544, 12.344], [49.566, 12.188], [49.644, 12.022], [49.622, 11.899], [49.711, 11.755], [49.811, 11.722], [49.863, 11.855]];
                L.polygon(neustadtPolygon, { color: "#ffd700", weight: 2, fillColor: "#ffd700", fillOpacity: 0.0 }).addTo(countyPolygonsLayer);
            }
            if (name === "Altenkirchen (Westerwald)") {
                let altenkirchenPolygon = [[50.865, 7.533], [50.922, 7.722], [50.845, 7.965], [50.822, 8.022], [50.711, 7.944], [50.599, 7.844], [50.622, 7.611], [50.688, 7.455], [50.785, 7.444], [50.865, 7.533]];
                L.polygon(altenkirchenPolygon, { color: "#ffd700", weight: 2, fillColor: "#ffd700", fillOpacity: 0.0 }).addTo(countyPolygonsLayer);
            }
            if (name === "Eifelkreis Bitburg-Prüm") {
                let bitburgPolygon = [[50.315, 6.222], [50.288, 6.455], [50.188, 6.644], [50.122, 6.755], [49.995, 6.688], [49.885, 6.511], [49.812, 6.455], [49.833, 6.188], [49.988, 6.111], [50.122, 6.133], [50.215, 6.022], [50.315, 6.222]];
                L.polygon(bitburgPolygon, { color: "#ffd700", weight: 2, fillColor: "#ffd700", fillOpacity: 0.0 }).addTo(countyPolygonsLayer);
            }

            if (kreiseLayer) {
                kreiseLayer.eachLayer(function(layer) {
                     if (matchRegionName(name, layer.featureName)) {
                         let countyPoly = L.polygon(layer.getLatLngs(), { color: "#ffd700", weight: 2, fillColor: "#ffd700", fillOpacity: 0.0 });
                         countyPolygonsLayer.addLayer(countyPoly);
                     }
                });
            }

            updateRegionCounters();
        }

        function refreshMapState() {
            markersLayer.clearLayers();
            countyPolygonsLayer.clearLayers();
            markerMapElements = {};

            let regionsToDraw = new Set();
            
            if (currentFilteredLand && landMap[currentFilteredLand]) {
                landMap[currentFilteredLand].forEach(r => regionsToDraw.add(r));
            }
            
            document.querySelectorAll('.region-chk').forEach(chk => {
                if (chk.checked) {
                    regionsToDraw.add(chk.value.trim());
                }
            });

            regionsToDraw.forEach(name => {
                let matchingLabel = Array.from(document.querySelectorAll('.region-chk')).find(cb => cb.value.trim() === name);
                let info = matchingLabel ? matchingLabel.closest('.region-label').getAttribute('data-info') : "";
                drawSingleRegionOnMap(name, info);
            });

            updateRegionCounters();
        }

        function selectLand(landName) {
            let regions = landMap[landName] || [];
            let header = document.getElementById('selectedLandTitle');
            header.style.display = 'block';
            if (regions.length === 0) {
                header.innerHTML = `❌ Brak rejonów w: <strong>${landName}</strong>`;
                return;
            }
            header.innerHTML = `Land: <strong>${landName}</strong> (${regions.length} rejonów)`;
            currentFilteredLand = landName;
            openRegionsList();
            
            document.querySelectorAll('.region-label').forEach(label => {
                let val = label.querySelector('input').value.trim();
                label.style.display = regions.includes(val) ? 'flex' : 'none';
            });

            refreshMapState();

            if(markersLayer.getLayers().length > 0) { 
                map.fitBounds(markersLayer.getBounds(), {paddingTopLeft: [40, 140], paddingBottomRight: [40, 80], maxZoom: 10});
            }
            updateCountySuggestions();
        }

        function selectOnlyNormalRegions(e) {
            if (e) e.preventDefault();
            currentFilteredLand = null;
            document.getElementById('selectedLandTitle').style.display = 'none';
            openRegionsList();
            
            document.querySelectorAll('.region-chk').forEach(chk => {
                let info = chk.closest('.region-label').getAttribute('data-info') || "";
                let isFesteTermine = info.includes("Terminy stałe");
                chk.checked = isFesteTermine;
                chk.closest('.region-label').style.display = 'flex'; 
            });

            refreshMapState();

            if(markersLayer.getLayers().length > 0) { 
                map.fitBounds(markersLayer.getBounds(), {paddingTopLeft: [40, 140], paddingBottomRight: [40, 80], maxZoom: 9});
            }
            updateCountySuggestions();
        }

        function addToCart(regionName) {
            if (!cartRegions.includes(regionName)) {
                cartRegions.push(regionName);
                updateCartSummary();
                updateListButtons();
                triggerMarkerPulse(regionName); 
                showOrderPopup(regionName);
            }
        }

        function showOrderPopup(regionName) {
            let popup = document.getElementById('dabuOrderPopup');
            let popupText = document.getElementById('dabuOrderPopupText');
            popupText.innerText = regionName;
            popup.classList.add('show');
            setTimeout(() => { popup.classList.remove('show'); }, 1500);
        }

        function triggerMarkerPulse(regionName) {
            let marker = markerMapElements[regionName];
            if (marker) {
                let iconEl = marker.getElement();
                if (iconEl) {
                    let pinDiv = iconEl.querySelector('.treasure-pin');
                    if (pinDiv) {
                        pinDiv.classList.add('pulse-treasure');
                        setTimeout(() => { pinDiv.classList.remove('pulse-treasure'); }, 2400); 
                    }
                }
            }
        }

        function updateCartSummary() {
            let summaryEl = document.getElementById('selectedRegionsSummary');
            if (cartRegions.length === 0) {
                summaryEl.innerHTML = "Wybrane: brak";
            } else {
                summaryEl.innerHTML = "Wybrane: <strong>" + cartRegions.join(', ') + "</strong>";
            }
        }

        function updateListButtons() {
            document.querySelectorAll('.add-list-btn').forEach(btn => {
                let rName = btn.getAttribute('data-region');
                if (cartRegions.includes(rName)) {
                    btn.innerHTML = "✓ Dodano";
                    btn.style.background = "#ffd700";
                    btn.style.color = "#000";
                    btn.style.borderColor = "#ffd700";
                } else {
                    btn.innerHTML = "+";
                    btn.style.background = "rgba(0, 255, 127, 0.15)";
                    btn.style.color = "#00FF7F";
                    btn.style.borderColor = "#00FF7F";
                }
            });
        }

        function clearAllFilters(e) {
            if (e) e.preventDefault();
            document.getElementById('dabuRegionSearch').value = '';
            currentFilteredLand = null;
            cartRegions = [];
            markerMapElements = {};
            updateCartSummary();
            updateListButtons();
            document.getElementById('selectedLandTitle').style.display = 'none';
            document.querySelectorAll('.region-chk').forEach(chk => chk.checked = false);
            document.querySelectorAll('.region-label').forEach(l => l.style.display = 'flex');
            closeRegionsList();
            refreshMapState();
            
            let isMobile = window.innerWidth <= 600;
            map.flyTo([51.1657, 10.4515], isMobile ? 5.8 : 6.2, { duration: 0.8 });
            updateCountySuggestions();
        }

        function updateCountySuggestions() {
            let container = document.getElementById('countySuggestions');
            container.innerHTML = '';
            if (currentFilteredLand) {
                let btnReset = document.createElement('button');
                btnReset.className = 'dabu-county-btn';
                btnReset.style.background = '#ff4444'; btnReset.style.color = 'white';
                btnReset.innerHTML = '✖ Reset wyboru';
                btnReset.onclick = (e) => { e.preventDefault(); clearAllFilters(); };
                container.appendChild(btnReset);
            }
        }

        function filterDabuRegions() {
            openRegionsList();
            let input = document.getElementById('dabuRegionSearch').value.toLowerCase().trim();
            
            document.querySelectorAll('.region-label').forEach(label => {
                let val = label.querySelector('input').value.trim();
                let county = (regionToCountyMap[val] || "").toLowerCase();
                
                let textMatch = label.textContent.toLowerCase().includes(input) || county.includes(input);
                
                if (currentFilteredLand) {
                    let inLand = landMap[currentFilteredLand] && landMap[currentFilteredLand].includes(val);
                    label.style.display = (textMatch && inLand) ? "flex" : "none";
                } else {
                    label.style.display = textMatch ? "flex" : "none";
                }
            });
        }

        // DYNAMICZNE BUDOWANIE ELEMENTÓW LISTY ZE WSZYSTKICH WSPÓŁRZĘDNYCH
        function buildRegionsList() {
            const container = document.getElementById('regionsListItems');
            container.innerHTML = '';
            
            const sortedNames = Object.keys(regionCoords).sort((a,b) => a.localeCompare(b, 'de', {sensitivity: 'base'}));
            
            sortedNames.forEach(name => {
                const label = document.createElement('label');
                label.className = 'region-label';
                label.setAttribute('data-info', 'Terminy na żądanie / Termine auf Abruf');
                
                const chk = document.createElement('input');
                chk.className = 'region-chk';
                chk.type = 'checkbox';
                chk.name = 'regiony[]';
                chk.value = name;
                
                label.appendChild(chk);
                label.appendChild(document.createTextNode(' ' + name));
                
                chk.addEventListener('change', () => {
                    if (chk.checked) {
                        drawSingleRegionOnMap(name, label.getAttribute('data-info'));
                        if (regionCoords[name]) {
                            map.flyTo(regionCoords[name], 9, {duration: 0.5});
                            setTimeout(() => {
                                if (markerMapElements[name]) {
                                    markerMapElements[name].openPopup();
                                }
                            }, 500);
                        }
                    } else {
                        refreshMapState();
                    }
                });

                let btn = document.createElement('button');
                btn.type = "button";
                btn.className = "add-list-btn";
                btn.innerHTML = "+";
                btn.setAttribute('data-region', name);
                btn.title = "Dodaj do zapytania";
                btn.onclick = (e) => {
                    e.stopPropagation();
                    e.preventDefault();
                    addToCart(name);
                };
                label.appendChild(btn);

                container.appendChild(label);
            });
            
            updateRegionCounters();
        }

        document.addEventListener("DOMContentLoaded", () => {
            buildRegionsList();
        });

        function sendSingleRegionInquiry(regionName) {
            let phoneNumber = "+48600812820";
            let isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            let smsSeparator = isIOS ? "&" : "?";
            let message = `Dzień dobry, proszę o informację i wycenę w sprawie rejonu: ${regionName}.`;
            window.location.href = `sms:${phoneNumber}${smsSeparator}body=${encodeURIComponent(message)}`;
        }

        function sendSmsQuote() {
            if (cartRegions.length === 0) {
                alert("Wybierz przynajmniej jeden rejon klikając '+' na liście lub w dymku na mapie.");
                return;
            }

            let phoneNumber = "+48600812820";
            let isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            let smsSeparator = isIOS ? "&" : "?";
            
            let message = cartRegions.length === 1
                ? `Dzień dobry, proszę o informację i wycenę w sprawie rejonu: ${cartRegions[0]}.`
                : `Dzień dobry, proszę o informację i wycenę w sprawie rejonów: ${cartRegions.join(', ')}.`;

            window.location.href = `sms:${phoneNumber}${smsSeparator}body=${encodeURIComponent(message)}`;
        }
    </script>

    <script src="translator.js"></script>
    <script src="/footer.js"></script>
</body>
</html>
