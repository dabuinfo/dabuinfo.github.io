            background: rgba(46, 204, 113, 0.15); border: 1px solid rgba(46, 204, 113, 0.4);

            margin-bottom: 8px; cursor: pointer;
        }

        .days-filter-row {
            display: flex; gap: 5px; justify-content: space-between;
        }

        .day-btn {
            flex: 1; padding: 6px 2px; font-size: 11px; font-weight: 700; text-align: center;
            border: none; border-radius: 6px; color: white; cursor: pointer; user-select: none;
            transition: all 0.2s ease;
        }

        .day-btn.inactive { background: #374151 !important; color: #9ca3af; opacity: 0.45; }

        .region-pin {
            border-radius: 50%; width: 32px; height: 32px; text-align: center; line-height: 32px;
            color: #ffffff; font-size: 13px; font-weight: 800; box-shadow: 0 3px 8px rgba(0,0,0,0.5);
            border: 2px solid #ffffff; transition: transform 0.2s ease; cursor: pointer;
        }
        .region-pin:hover { transform: scale(1.15); }

        .leaflet-popup-content-wrapper {
            background: #181818 !important; color: #e2e8f0 !important;
            padding: 0; overflow: hidden; border-radius: 10px; border: 1px solid #333;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }
        .leaflet-popup-content { margin: 0 !important; line-height: 1.4; }

        .popup-action-btn {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            text-align: center; padding: 9px 10px; border-radius: 6px; text-decoration: none;
            font-weight: 700; font-size: 12.5px; transition: all 0.2s ease; box-sizing: border-box;
            cursor: pointer; border: none; width: 100%;
        }
        .popup-action-btn:hover { filter: brightness(1.12); }

            background: linear-gradient(90deg, #2ecc71 0%, #27ae60 100%);

            color: #ffffff !important;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }

        .btn-day-single {
            background: #242424; color: #38bdf8 !important;
            border: 1px solid rgba(56, 189, 248, 0.4);
        }
        .btn-day-single:hover { background: #2f2f2f; }

        .btn-route-add {
            background: #0284c7; color: #ffffff !important;
            border: 1px solid #38bdf8;
        }
        .btn-route-add:hover { background: #0369a1; }

        .btn-route-remove {
            background: #7f1d1d; color: #fecaca !important;
            border: 1px solid #ef4444;
        }
        .btn-route-remove:hover { background: #991b1b; }

            background: rgba(15, 23, 42, 0.6);
            border-left: 3px solid #fbbf24;
            padding: 6px 10px;
            margin: 6px 0;
            border-radius: 4px;
            font-size: 11.5px;
            color: #cbd5e1;
            line-height: 1.35;
        }

        .towns-summary-box {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-left: 3.5px solid #38bdf8;
            padding: 7px 10px;
            margin: 6px 0;
            border-radius: 5px;
            font-size: 11px;
            line-height: 1.4;
        }

            border-left: 4px solid #ef4444;
            padding: 8px 10px;
            margin: 7px 0;
            border-radius: 5px;
            font-size: 11px;
            color: #fecaca;
            line-height: 1.35;
            box-shadow: 0 2px 8px rgba(239, 68, 68, 0.15);

            display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px;
        }

            background: #ef4444; color: #ffffff; font-size: 9.5px; font-weight: 800; padding: 1px 6px; border-radius: 4px; letter-spacing: 0.5px;
        }

        .info-free-box {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            border-left: 3px solid #10b981;
            padding: 6px 10px;
            margin: 6px 0;
            border-radius: 4px;
            font-size: 11.5px;
            color: #a7f3d0;
            line-height: 1.35;
            font-weight: 600;
        }

        .nearby-box {
            background: #111827;
            border: 1px solid #374151;
            padding: 8px 10px;
            margin: 8px 0;
            border-radius: 6px;
            font-size: 11px;
        }
        .nearby-title {
            color: #38bdf8; font-weight: 700; margin-bottom: 5px; display: flex; align-items: center; gap: 5px;
        }
        .nearby-item {
            display: flex; justify-content: space-between; align-items: center; padding: 3px 0; border-bottom: 1px dashed #2d3748;
        }
        .nearby-item:last-child { border-bottom: none; }

        .bottom-summary-box {
            position: absolute; bottom: 25px; left: 10px; z-index: 1000;
            background: rgba(18, 24, 38, 0.94); backdrop-filter: blur(8px);
            padding: 8px 14px; border-radius: 8px; border: 1px solid #2d3748;
            color: #cbd5e1; font-size: 12px; font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
        }

        /* WIDGET TRASY KLIENTA */
        .route-float-btn {
            position: absolute; 
            bottom: 70px;
            left: 10px;
            z-index: 1500;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            border: 1.5px solid #38bdf8; color: #ffffff;
            padding: 9px 16px; border-radius: 30px;
            display: flex; align-items: center; gap: 8px;
            font-size: 12.5px; font-weight: 700; cursor: pointer;

        .route-badge-num {

            width: 20px; height: 20px; display: inline-flex;
            align-items: center; justify-content: center; font-size: 11px; font-weight: 800;

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(5px);
            z-index: 3000; display: none; align-items: center; justify-content: center; padding: 12px; box-sizing: border-box;
        }
        .modal-box {
            background: #111827; border: 1.5px solid #38bdf8; border-radius: 14px;
            max-width: 480px; width: 100%; max-height: 90vh; overflow-y: auto;
            padding: 20px 22px; box-shadow: 0 10px 35px rgba(0,0,0,0.8); color: #f3f4f6; box-sizing: border-box;

        .modal-regions-list {
            max-height: 220px; overflow-y: auto; background: #1f2937; border: 1px solid #374151;

<body>

    <div class="top-nav-panel">
        <div class="header-row">
            <div class="header-title">
                <span id="uiTitle">🇩🇪 Mapa Wystawek w Niemczech</span>
                <span class="badge-de">LIVE</span>
            </div>
            <div id="statusCounter" style="color: #2ecc71; font-size: 12px; font-weight: 700;">
                Wczytywanie...
            </div>
        </div>

        <select id="weekSelect" class="select-week" onchange="zmienTydzien()">
            <option value="" id="uiWeekPlaceholder">⏳ Ładowanie dostępnych tygodni...</option>
        </select>

        <!-- FILTR FRAKCJI -->
        <select id="fractionSelect" class="select-week" style="margin-bottom: 8px; background: #0f172a; border-color: #38bdf8; color: #38bdf8;" onchange="odswiezMape()">
            <option value="ALL" id="uiFractionAll">♻️ Wszystkie frakcje</option>
            <option value="METAL_ELEKTRO" id="uiFractionMetalElektro">⚙️ Złom / Metall + Elektro</option>
        </select>

        <div class="days-filter-row">
            <button id="btn-0" class="day-btn" style="background:#2563eb;" onclick="toggleDzien(0)">Pon</button>
            <button id="btn-1" class="day-btn" style="background:#16a34a;" onclick="toggleDzien(1)">Wt</button>
            <button id="btn-2" class="day-btn" style="background:#ea580c;" onclick="toggleDzien(2)">Śr</button>
            <button id="btn-3" class="day-btn" style="background:#9333ea;" onclick="toggleDzien(3)">Czw</button>
            <button id="btn-4" class="day-btn" style="background:#dc2626;" onclick="toggleDzien(4)">Pt</button>
            <button id="btn-5" class="day-btn" style="background:#059669; display: none;" onclick="toggleDzien(5)">Sob</button>
        </div>
    </div>

    <div class="bottom-summary-box">
        <span id="uiSummaryText">📍 Aktywne rejony w tym widoku: <strong id="activeCount" style="color:#2ecc71;">0</strong></span>
    </div>

    <!-- PŁYWAJĄCY PRZYCISK TRASY -->
    <div id="routeFloatingBtn" class="route-float-btn" onclick="otworzModalWyceny()" style="display:none;">
        <i class="fa-solid fa-route"></i>
        <span id="uiRouteFloatTitle">Twoja trasa:</span>
        <span id="routeBadgeCount" class="route-badge-num">0</span>
        <span id="uiRouteFloatQuote" style="color:#7dd3fc; margin-left:3px;">Wycena →</span>
    </div>

    <!-- MODAL FORMULARZA WYCENY -->
    <div id="routeModalOverlay" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="uiModalTitleText"><i class="fa-solid fa-route"></i> Zapytanie o wycenę trasy</h3>
                <button class="modal-close-btn" onclick="zamknijModalWyceny()">×</button>
            </div>
            
            <div style="font-size: 11.5px; color: #94a3b8; margin-bottom: 8px;">
                <span id="uiModalSubtitleText">Wybrane rejony do przygotowania zestawienia</span> 
                (<span id="uiModalWeekTag">Tydzień</span> <span id="modalTydzienLabel" style="color:#38bdf8; font-weight:bold;">-</span>):
            </div>
            
            <div id="modalRegionsContainer" class="modal-regions-list"></div>

            <form id="routeQuoteForm" onsubmit="wyslijZapytanieWyceny(event)">
                
                <!-- POLE WYBORU FRAKCJI W FORMULARZU -->
                <div class="modal-form-group">
                    <label id="uiQuoteFractionLabel">Jakich frakcji szukasz? *</label>
                    <select id="quoteFractionFilter" class="modal-input" required>
                        <option value="Wszystko co jest w danym dniu" id="uiQuoteFractionAll">Wszystko co jest w danym dniu</option>
                        <option value="Złom / Metall + Elektro" id="uiQuoteFractionMetalElektro">Złom / Metall + Elektro</option>
                    </select>
                </div>

                <div class="modal-form-group">
                    <label id="uiQuoteNameLabel">Imię lub Nick *</label>
                    <input type="text" id="quoteName" class="modal-input" required placeholder="...">
                </div>
                <div class="modal-form-group">
                    <label id="uiQuotePhoneLabel">Telefon / WhatsApp (najszybszy kontakt) *</label>
                    <input type="tel" id="quotePhone" class="modal-input" required placeholder="...">
                </div>
                <div class="modal-form-group">
                    <label id="uiQuoteEmailLabel">Adres E-mail</label>
                    <input type="email" id="quoteEmail" class="modal-input" placeholder="...">
                </div>
                <div class="modal-form-group">
                    <label id="uiQuoteNotesLabel">Uwagi / Termin planowanego wyjazdu</label>
                    <textarea id="quoteNotes" class="modal-input" rows="2" placeholder="..."></textarea>
                </div>
                
                <button type="submit" id="quoteSubmitBtn" class="modal-submit-btn">
                    🚀 Wyślij zapytanie o wycenę
                </button>
            </form>
            <div id="quoteStatusMsg" style="margin-top:10px; font-size:12px; text-align:center; display:none;"></div>
        </div>
    </div>

    <div id="map"></div>
