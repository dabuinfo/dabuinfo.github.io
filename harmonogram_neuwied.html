    let activeKW = getCurrentKW();

    function getCurrentKW() {
      const now = new Date();
      const d = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
      const dayNum = d.getUTCDay() || 7;
      d.setUTCDate(d.getUTCDate() + 4 - dayNum);
      const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
      const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
      return 'KW ' + String(weekNo).padStart(2, '0');
    }

    function getTodayString() {
      const now = new Date();
      const y = now.getFullYear();
      const m = String(now.getMonth() + 1).padStart(2, '0');
      const d = String(now.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function updateKWChips() {
      const kwContainer = document.getElementById('kwChipsContainer');
      const hidePast = document.getElementById('hidePastCheckbox').checked;
      const today = getTodayString();

      const availableData = hidePast ? RAW_DATA.filter(x => x.t >= today) : RAW_DATA;
      const uniqueKW = Array.from(new Set(availableData.map(x => x.k))).sort();

      if (activeKW !== 'ALL' && !uniqueKW.includes(activeKW)) {
        activeKW = 'ALL';
      }

      kwContainer.innerHTML = '';
      const allKWChip = document.createElement('div');
      allKWChip.className = 'chip chip-kw' + (activeKW === 'ALL' ? ' active' : '');
      allKWChip.textContent = 'Wszystkie tygodnie (' + uniqueKW.length + ')';
      allKWChip.onclick = () => filterKW('ALL', allKWChip);
      kwContainer.appendChild(allKWChip);

      uniqueKW.forEach(k => {
        const chip = document.createElement('div');
        chip.className = 'chip chip-kw' + (activeKW === k ? ' active' : '');
        chip.textContent = k;
        chip.onclick = () => filterKW(k, chip);
        kwContainer.appendChild(chip);
      });
    }

    function filterKW(k, element) {
      activeKW = k;
      document.querySelectorAll('#kwChipsContainer .chip').forEach(c => c.classList.remove('active'));
      element.classList.add('active');
      render();
    }

    function onHidePastChanged() {
      updateKWChips();
      render();
    }

    function toggleTheme() {
      document.body.classList.toggle('dark-theme');
    }

    function expandAll(expand) {
      document.querySelectorAll('.date-card').forEach(c => {
        if (expand) c.classList.remove('collapsed');
        else c.classList.add('collapsed');
      });
      document.querySelectorAll('.faction-group').forEach(fg => {
        if (expand) fg.classList.remove('collapsed');
        else fg.classList.add('collapsed');
      });
    }

    function render() {
      const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
      const hidePast = document.getElementById('hidePastCheckbox').checked;
      const today = getTodayString();
      const container = document.getElementById('cardsContainer');
      const emptyState = document.getElementById('emptyState');

      const groupedDates = {};
      let totalPlacesVisible = 0;

      RAW_DATA.forEach(row => {
        if (hidePast && row.t < today) return;
        if (activeKW !== 'ALL' && row.k !== activeKW) return;

        const placesBlob = row.places.join(' ').toLowerCase();
        const searchBlob = `${row.kwFull} ${row.r} ${placesBlob}`.toLowerCase();
        if (searchVal && !searchBlob.includes(searchVal)) return;

        const groupKey = row.kwFull;
        if (!groupedDates[groupKey]) {
          groupedDates[groupKey] = {
            kwFull: row.kwFull,
            kwShort: row.k,
            pretty: row.p,
            day: row.d,
            factions: {}
          };
        }

        if (!groupedDates[groupKey].factions[row.r]) {
          groupedDates[groupKey].factions[row.r] = [];
        }

        row.places.forEach(p => {
          if (!groupedDates[groupKey].factions[row.r].includes(p)) {
            groupedDates[groupKey].factions[row.r].push(p);
            totalPlacesVisible++;
          }
        });
      });

      const groupKeys = Object.keys(groupedDates).sort();
      document.getElementById('countDays').textContent = groupKeys.length;
      document.getElementById('countStreets').textContent = totalPlacesVisible;

      if (groupKeys.length === 0) {
        container.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }
      emptyState.style.display = 'none';

      container.innerHTML = groupKeys.map(gKey => {
        const gItem = groupedDates[gKey];

        const factionsHtml = Object.keys(gItem.factions).sort().map(factionName => {
          const places = gItem.factions[factionName];
          const isElektro = factionName.toLowerCase().includes('elektro');
          const badgeClass = isElektro ? 'badge-elektro' : 'badge-sperr';
          const icon = isElektro ? '⚡' : '🛋️';

          const placesHtml = places.map(placeName => {
            let placeDisplay = placeName;
            if (searchVal) {
              const regex = new RegExp(`(${searchVal})`, 'gi');
              placeDisplay = placeDisplay.replace(regex, '<mark>$1</mark>');
            }

            const mapQuery = encodeURIComponent(`${placeName}, Neuwied`);
            const mapUrl = `https://www.google.com/maps/search/?api=1&query=${mapQuery}`;

            return `
              <a href="${mapUrl}" target="_blank" rel="noopener" class="place-chip">
                <span>📍 ${placeDisplay}</span>
                <svg width="10" height="10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
              </a>
            `;
          }).join('');

          const isFactionCollapsed = searchVal ? '' : 'collapsed';
          return `
            <div class="faction-group ${isFactionCollapsed}">
              <div class="faction-header-bar" onclick="this.parentElement.classList.toggle('collapsed')">
                <span class="faction-title ${badgeClass}">
                  <span>${icon} ${factionName}</span>
                </span>
                <span class="faction-header-badge">
                  <span>${places.length} miejsc</span>
                  <svg class="faction-arrow" width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </span>
              </div>
              <div class="places-grid">
                ${placesHtml}
              </div>
            </div>
          `;
        }).join('');

        return `
          <article class="date-card">
            <div class="date-header" onclick="this.parentElement.classList.toggle('collapsed')">
              <div class="date-info-left">
                <span class="date-title">📅 ${gItem.kwFull}</span>
                <span class="date-kw-badge">${gItem.kwShort}</span>
              </div>
              <div class="date-meta">
                <span>Frakcji: <strong>${Object.keys(gItem.factions).length}</strong></span>
                <svg class="toggle-arrow" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
              </div>
            </div>
            <div class="date-body">
              ${factionsHtml}
            </div>
          </article>
        `;
      }).join('');
    }

    document.getElementById('searchInput').addEventListener('input', render);

    updateKWChips();
    render();
  </script>
