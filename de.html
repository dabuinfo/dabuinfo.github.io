<html lang="pl">
<head>

  <meta charset="UTF-8">

  <title>Wyszukiwarka Terminów Wywozu Odpadów</title>

  <style>
    body {
      background-color: #0f172a;
      margin: 0;
      padding: 20px 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;

    @media (min-width: 768px) {
      body {
        background-image: url('3bbd5476-5918-4598-8484-65b13423c679.jpg');
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
      }
    }

    /* Ukrycie paska Google Translate */
    .goog-te-banner-frame.skiptranslate { display: none !important; }
    body { top: 0px !important; }

    /* Modal logowania */
    .login-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #0f172a;
      z-index: 100000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: #1e293b;
      padding: 28px 24px;
      border-radius: 16px;
      border: 1px solid #334155;

      text-align: center;
    }

    .login-card h2 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 1.3rem;
      color: #38bdf8;
    }

    .login-card p {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 20px;
    }

    /* Karta wyszukiwarki */
    .odpady-search-card {
      max-width: 100%;
      width: 440px;
      margin: 0 auto;
      padding: 24px 20px;
      background: rgba(30, 41, 59, 0.8);
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      color: #f8fafc;
      box-sizing: border-box;
      border: 1px solid #334155;
      display: none;
    }

    .user-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f172a;
      padding: 8px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      border: 1px solid #334155;
    }

    .logout-btn {
      background: transparent;
      border: 1px solid #f87171;
      color: #f87171;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .odpady-form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .odpady-form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      font-size: 0.9rem;
      color: #cbd5e1;
    }

    .odpady-input, .odpady-select {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      border: 1px solid #475569;
      border-radius: 10px;
      box-sizing: border-box;
      outline: none;
      transition: all 0.2s ease;
      background-color: #0f172a;
      color: #f8fafc;
      cursor: pointer;
    }

    .odpady-btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 700;
      color: #0f172a;
      background-color: #38bdf8;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 8px;
    }

    .odpady-results { margin-top: 22px; text-align: left; }
    .odpady-result-box { background-color: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 16px; }
    .odpady-result-title { font-weight: 700; margin-bottom: 10px; color: #e2e8f0; font-size: 0.95rem; }
    .odpady-fraction-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.95rem; }
    .odpady-fraction-name { color: #cbd5e1; font-weight: 500; }
    .odpady-fraction-date { color: #4ade80; font-weight: 700; background-color: rgba(74, 222, 128, 0.12); border: 1px solid rgba(74, 222, 128, 0.3); padding: 5px 10px; border-radius: 8px; }

    .odpady-status-msg { font-size: 0.9rem; font-weight: 600; text-align: center; padding: 12px; border-radius: 8px; }
    .odpady-status-msg.error { color: #f87171; background: rgba(248, 113, 113, 0.1); }
    .odpady-status-msg.info { color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
    .odpady-status-msg.warning { color: #fbbf24; background: rgba(251, 191, 36, 0.1); }

    .odpady-modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #0f172a; z-index: 99999;
      display: flex; flex-direction: column; padding: 16px; box-sizing: border-box;
      opacity: 0; pointer-events: none; transition: opacity 0.25s ease;
    }
    .odpady-modal-overlay.active { opacity: 1; pointer-events: auto; }
    .odpady-modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .odpady-modal-title { font-size: 1.1rem; font-weight: 700; color: #f8fafc; }
    .odpady-modal-close { background: #334155; border: none; color: #f8fafc; font-size: 1.2rem; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; }
    .odpady-modal-search-input { width: 100%; padding: 14px 16px; font-size: 16px; border: 1px solid #38bdf8; border-radius: 10px; background: #1e293b; color: #fff; margin-bottom: 12px; box-sizing: border-box; outline: none; }
    .odpady-modal-list { flex: 1; overflow-y: auto; margin: 0; padding: 0; list-style: none; }
    .odpady-modal-item { padding: 14px 16px; border-bottom: 1px solid #1e293b; color: #cbd5e1; font-size: 1rem; cursor: pointer; display: flex; align-items: center; justify-content: space-between; }
  </style>
</head>
<body>

<!-- Kontener Tłumacza Google (niewidoczny dla użytkownika, do automatycznego sterowania) -->
<div id="google_translate_element" style="display:none;"></div>

<!-- Ekran logowania -->
<div id="loginOverlay" class="login-overlay">
  <div class="login-card">
    <h2>🔐 Strefa Klienta</h2>
    <p>Dostęp do bazy wyłącznie dla zalogowanych użytkowników.</p>
    
    <div class="odpady-form-group">
      <label for="loginInput">Login:</label>
      <input type="text" id="loginInput" class="odpady-input notranslate" placeholder="Wpisz login...">
    </div>
    
    <div class="odpady-form-group">
      <label for="passwordInput">Hasło:</label>
      <input type="password" id="passwordInput" class="odpady-input" placeholder="Wpisz hasło...">
    </div>
    
    <button class="odpady-btn" onclick="zalogujKlienta()">Zaloguj się</button>

    <!-- PRZYCISK GOOGLE -->
    <div style="margin-top: 15px; display: flex; justify-content: center;">
      <div id="g_id_onload"
         data-client_id="19634168057-qhdva2g5voubiqcr7jnb2i7vkehi3t0q.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleGoogleResponse"
         data-auto_prompt="false">
      </div>
      <div class="g_id_signin"
         data-type="standard"
         data-shape="rectangular"
         data-theme="outline"
         data-text="signin_with"
         data-size="large"
         data-logo_alignment="center">
      </div>
    </div>
    <!-- KONIEC PRZYCISKU GOOGLE -->
    
    <div id="loginStatus" style="margin-top: 14px;"></div>
  </div>
</div>

<!-- Główna karta wyszukiwarki -->
<div id="searchCard" class="odpady-search-card">
  <div class="user-bar">
    <span>👤 Zalogowany: <strong id="userLoginText" class="notranslate"></strong></span>
    <button class="logout-btn" onclick="wylogujKlienta()">Wyloguj</button>
  </div>

  <h3>🔍 Terminy odbioru odpadów</h3>

  <div class="odpady-form-group">
    <label for="odpadyLand">Land (Kraj związkowy):</label>
    <input type="text" id="odpadyLand" class="odpady-input notranslate" placeholder="Dotknij, aby wybrać land..." readonly disabled onclick="odpadyOtworzModal('land')">
  </div>

  <div class="odpady-form-group">
    <label for="odpadyPowiat">Powiat/Miasto:</label>
    <input type="text" id="odpadyPowiat" class="odpady-input notranslate" placeholder="Najpierw wybierz land..." readonly disabled onclick="odpadyOtworzModal('powiat')">
  </div>

  <div class="odpady-form-group">
    <label for="odpadyOrt">Miejscowość:</label>
    <input type="text" id="odpadyOrt" class="odpady-input notranslate" placeholder="Najpierw wybierz powiat/miasto..." readonly disabled onclick="odpadyOtworzModal('ort')">
  </div>

  <div class="odpady-form-group">
    <label for="odpadyLitera">Pierwsza litera ulicy:</label>
    <select id="odpadyLitera" class="odpady-select notranslate" disabled onchange="odpadyPobierzUlice()">
      <option value="">-- Wszystkie / Wybierz literę --</option>
      <option value="A">A</option><option value="B">B</option><option value="C">C</option>
      <option value="D">D</option><option value="E">E</option><option value="F">F</option>
      <option value="G">G</option><option value="H">H</option><option value="I">I</option>
      <option value="J">J</option><option value="K">K</option><option value="L">L</option>
      <option value="M">M</option><option value="N">N</option><option value="O">O</option>
      <option value="P">P</option><option value="Q">Q</option><option value="R">R</option>
      <option value="S">S</option><option value="T">T</option><option value="U">U</option>
      <option value="V">V</option><option value="W">W</option><option value="X">X</option>
      <option value="Y">Y</option><option value="Z">Z</option><option value="Ä">Ä</option>
      <option value="Ö">Ö</option><option value="Ü">Ü</option>
    </select>
  </div>

  <div class="odpady-form-group">
    <label for="odpadyStrasse">Ulica:</label>
    <input type="text" id="odpadyStrasse" class="odpady-input notranslate" placeholder="Najpierw wybierz miejscowość..." readonly disabled onclick="odpadyOtworzModal('strasse')">
  </div>

  <button class="odpady-btn" onclick="odpadySzukajTerminu()">Sprawdź termin</button>

  <div id="odpadyWynik" class="odpady-results"></div>
</div>

<!-- Modal wyszukiwania -->
<div id="odpadyModal" class="odpady-modal-overlay">
  <div class="odpady-modal-header">
    <div id="odpadyModalTitle" class="odpady-modal-title">Wybierz...</div>
    <button class="odpady-modal-close" onclick="odpadyZamknijModal()">✕</button>
  </div>
  <input type="text" id="odpadyModalSearch" class="odpady-modal-search-input notranslate" placeholder="🔎 Wpisz, aby filtrować..." oninput="odpadyFiltrujModalListe()">
  <ul id="odpadyModalList" class="odpady-modal-list notranslate"></ul>
</div>

<script>
  // GŁÓWNY LINK API DO TWOJEJ BAZY TERMINÓW
  const ODPADY_API_URL = "https://script.google.com/macros/s/AKfycbwtXIDPfuXY9nHsS1gDeXuXidBnl2n8csV_6-UXDgGWsk117eVHxO-uo_TMVTigb4ln/exec";
  const TARGET_PHONE = "48600812820";

  let daneLandy = [], danePowiaty = [], daneMiejscowosci = [], daneUlice = [];
  let aktywnyTypModala = "";

  document.addEventListener('DOMContentLoaded', () => {
    sprawdzSesje();
  });

  function sprawdzSesje() {
    const savedUser = localStorage.getItem('dabu_user');
    if (savedUser) {
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('searchCard').style.display = 'block';
      document.getElementById('userLoginText').innerText = savedUser;
      pobierzLandy();
    } else {
      document.getElementById('loginOverlay').style.display = 'flex';
      document.getElementById('searchCard').style.display = 'none';
    }
  }

  // --- TRADYCYJNE LOGOWANIE ---
  async function zalogujKlienta() {
    const login = document.getElementById('loginInput').value.trim();
    const haslo = document.getElementById('passwordInput').value.trim();
    const statusDiv = document.getElementById('loginStatus');

    if (!login || !haslo) {
      statusDiv.innerHTML = `<div class="odpady-status-msg error">Wpisz login i hasło.</div>`;
      return;
    }

    statusDiv.innerHTML = `<div class="odpady-status-msg info">⏳ Weryfikacja...</div>`;

    try {
      const res = await fetch(ODPADY_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'login', login: login, haslo: haslo })
      });
      const data = await res.json();

      if (data.status === 'success') {
        localStorage.setItem('dabu_user', data.login);
        sprawdzSesje();
      } else {
        statusDiv.innerHTML = `<div class="odpady-status-msg error">${data.message || 'Błąd logowania'}</div>`;
      }
    } catch (err) {
      console.error(err);
      statusDiv.innerHTML = `<div class="odpady-status-msg error">Błąd połączenia.</div>`;
    }
  }

  // --- LOGOWANIE PRZEZ GOOGLE ---
  function handleGoogleResponse(response) {
    const responsePayload = decodeJwtResponse(response.credential);
    const userEmail = responsePayload.email;
    wyslijDaneGoogleDoBazy(userEmail);
  }

  function decodeJwtResponse(token) {
    var base64Url = token.split('.')[1];
    var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    var jsonPayload = decodeURIComponent(atob(base64).split('').map(function(c) {
      return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
  }

  async function wyslijDaneGoogleDoBazy(email) {
    const statusDiv = document.getElementById('loginStatus');
    statusDiv.innerHTML = `<div class="odpady-status-msg info">⏳ Rejestracja/Logowanie Google...</div>`;

    try {
      const res = await fetch(ODPADY_API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'googleLogin', email: email })
      });
      const data = await res.json();

      if (data.status === 'success') {
        localStorage.setItem('dabu_user', data.login);
        sprawdzSesje();
      } else {
        statusDiv.innerHTML = `<div class="odpady-status-msg error">${data.message || 'Błąd autoryzacji Google'}</div>`;
      }
    } catch (err) {
      console.error(err);
      statusDiv.innerHTML = `<div class="odpady-status-msg error">Błąd połączenia z serwerem.</div>`;
    }
  }

  function wylogujKlienta() {
    localStorage.removeItem('dabu_user');
    location.reload();
  }

  // --- POBIERANIE LIST (GET) ---
  async function pobierzLandy() {
    const landInput = document.getElementById('odpadyLand');
    try {
      const res = await fetch(`${ODPADY_API_URL}?action=getLande`);
      daneLandy = await res.json();
      if (daneLandy && daneLandy.length > 0) {
        landInput.disabled = false;
        landInput.placeholder = "Dotknij, aby wybrać land...";
      }
    } catch (err) { console.error(err); }
  }

  function odpadyOtworzModal(typ) {
    aktywnyTypModala = typ;
    const modal = document.getElementById('odpadyModal');
    const title = document.getElementById('odpadyModalTitle');
    const searchInput = document.getElementById('odpadyModalSearch');
    searchInput.value = "";

    if (typ === 'land') { title.innerText = "Wybierz Land"; odpadyRenderujListeModala(daneLandy); }
    else if (typ === 'powiat') { title.innerText = "Wybierz Powiat"; odpadyRenderujListeModala(danePowiaty); }
    else if (typ === 'ort') { title.innerText = "Wybierz Miejscowość"; odpadyRenderujListeModala(daneMiejscowosci); }
    else if (typ === 'strasse') { title.innerText = "Wybierz Ulicę"; odpadyRenderujListeModala(daneUlice); }

    modal.classList.add('active');
    setTimeout(() => searchInput.focus(), 100);
  }

  function odpadyZamknijModal() { document.getElementById('odpadyModal').classList.remove('active'); }

  function odpadyRenderujListeModala(elementy) {
    const listContainer = document.getElementById('odpadyModalList');
    if (!elementy || elementy.length === 0) {
      listContainer.innerHTML = `<li class="odpady-modal-item" style="color: #64748b;">Brak wyników</li>`;
      return;
    }
    listContainer.innerHTML = elementy.map(item => `
      <li class="odpady-modal-item" onclick="odpadyWybierzElementModala(this.querySelector('span').innerText)">
        <span class="notranslate">${item}</span> ➔
      </li>
    `).join('');
  }

  function odpadyFiltrujModalListe() {
    const query = document.getElementById('odpadyModalSearch').value.toLowerCase();
    let zrodlo = [];
    if (aktywnyTypModala === 'land') zrodlo = daneLandy;
    else if (aktywnyTypModala === 'powiat') zrodlo = danePowiaty;
    else if (aktywnyTypModala === 'ort') zrodlo = daneMiejscowosci;
    else if (aktywnyTypModala === 'strasse') zrodlo = daneUlice;

    odpadyRenderujListeModala(zrodlo.filter(item => item.toLowerCase().includes(query)));
  }

  async function odpadyWybierzElementModala(wartosc) {
    odpadyZamknijModal();
    if (aktywnyTypModala === 'land') {
      document.getElementById('odpadyLand').value = wartosc;
      await odpadyPobierzPowiaty(wartosc);
    } else if (aktywnyTypModala === 'powiat') {
      document.getElementById('odpadyPowiat').value = wartosc;
      await odpadyPobierzMiejscowosci(wartosc);
    } else if (aktywnyTypModala === 'ort') {
      document.getElementById('odpadyOrt').value = wartosc;
      odpadyObsluzMiejscowosc(wartosc);
    } else if (aktywnyTypModala === 'strasse') {
      document.getElementById('odpadyStrasse').value = wartosc;
    }
  }

  async function odpadyPobierzPowiaty(landInputVal) {
    const powiatInput = document.getElementById('odpadyPowiat');
    powiatInput.value = ''; powiatInput.disabled = true; powiatInput.placeholder = "Ładowanie powiatów...";
    try {
      const res = await fetch(`${ODPADY_API_URL}?action=getPowiaty&land=${encodeURIComponent(landInputVal)}`);
      danePowiaty = await res.json();
      if (danePowiaty.length > 0) { powiatInput.disabled = false; powiatInput.placeholder = "Dotknij, aby wybrać powiat..."; }
    } catch (err) { console.error(err); }
  }

  async function odpadyPobierzMiejscowosci(powiatInputVal) {
    const landInputVal = document.getElementById('odpadyLand').value.trim();
    const ortInput = document.getElementById('odpadyOrt');
    ortInput.value = ''; ortInput.disabled = true; ortInput.placeholder = "Ładowanie miejscowości...";
    try {
      const res = await fetch(`${ODPADY_API_URL}?action=getOrte&land=${encodeURIComponent(landInputVal)}&powiat=${encodeURIComponent(powiatInputVal)}`);
      daneMiejscowosci = await res.json();
      if (daneMiejscowosci.length > 0) { ortInput.disabled = false; ortInput.placeholder = "Dotknij, aby wybrać miejscowość..."; }
    } catch (err) { console.error(err); }
  }

  function odpadyObsluzMiejscowosc(ortInput) {
    document.getElementById('odpadyLitera').disabled = false;
    document.getElementById('odpadyLitera').value = '';
    odpadyPobierzUlice();
  }

  async function odpadyPobierzUlice() {
    const landInput = document.getElementById('odpadyLand').value.trim();
    const powiatInput = document.getElementById('odpadyPowiat').value.trim();
    const ortInput = document.getElementById('odpadyOrt').value.trim();
    const litera = document.getElementById('odpadyLitera').value;
    const strasseInput = document.getElementById('odpadyStrasse');

    if (!ortInput) return;
    strasseInput.disabled = true; strasseInput.value = ''; strasseInput.placeholder = "Ładowanie ulic...";

    try {
      let url = `${ODPADY_API_URL}?action=getStrassen&land=${encodeURIComponent(landInput)}&powiat=${encodeURIComponent(powiatInput)}&ort=${encodeURIComponent(ortInput)}`;
      if (litera) url += `&litera=${encodeURIComponent(litera)}`;
      const res = await fetch(url);
      daneUlice = await res.json();
      if (daneUlice.length > 0) { strasseInput.disabled = false; strasseInput.placeholder = "Dotknij, aby wybrać ulicę..."; }
    } catch (err) { console.error(err); }
  }

  // --- WYSZUKIWANIE TERMINÓW ---
  async function odpadySzukajTerminu() {
    const user = localStorage.getItem('dabu_user');
    const land = document.getElementById('odpadyLand').value.trim();
    const powiat = document.getElementById('odpadyPowiat').value.trim();
    const ort = document.getElementById('odpadyOrt').value.trim();
    const strasse = document.getElementById('odpadyStrasse').value.trim();
    const wynikDiv = document.getElementById('odpadyWynik');

    if (!ort || !strasse) {
      wynikDiv.innerHTML = `<div class="odpady-status-msg warning">Proszę wybrać miejscowość i ulicę.</div>`;
      return;
    }

    wynikDiv.innerHTML = `<div class="odpady-status-msg info">⏳ Sprawdzanie terminarza...</div>`;

    try {
      const targetUrl = `${ODPADY_API_URL}?user=${encodeURIComponent(user)}&land=${encodeURIComponent(land)}&powiat=${encodeURIComponent(powiat)}&ort=${encodeURIComponent(ort)}&strasse=${encodeURIComponent(strasse)}`;
      const res = await fetch(targetUrl);
      const json = await res.json();

      // Obsługa braku limitów - cennik i pakiety zsynchronizowane z baza.html
      if (json.message === "LIMIT_REACHED") {
        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const day = String(now.getDate()).padStart(2, '0');
        const dateStr = `${year}${month}${day}`;
        const pin = Math.floor(1000 + Math.random() * 9000);

        // Domyślny rekomendowany pakiet: 25 zapytań (25T) za 10 EUR
        const orderCode25 = `${dateStr}-${pin}-25T`;
        const orderCode10 = `${dateStr}-${pin}-10T`;

        const msgText25 = `DABU-INFO Zamowienie: ${orderCode25} | Pakiet: 25 zapytan (10 EUR) | Login: ${user}`;
        const msgText10 = `DABU-INFO Zamowienie: ${orderCode10} | Pakiet: 10 zapytan (5 EUR) | Login: ${user}`;

        const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
        const smsDelimiter = isIOS ? '&' : '?';
        const smsLink25 = `sms:+${TARGET_PHONE}${smsDelimiter}body=${encodeURIComponent(msgText25)}`;
        const waLink25 = `https://wa.me/${TARGET_PHONE}?text=${encodeURIComponent(msgText25)}`;
        const waLink10 = `https://wa.me/${TARGET_PHONE}?text=${encodeURIComponent(msgText10)}`;

        wynikDiv.innerHTML = `
          <div class="odpady-status-msg error" style="text-align: left; line-height: 1.6; padding: 16px;">
            <div style="font-size: 1rem; font-weight: 700; margin-bottom: 8px; color: #f87171;">
              ❌ Wykorzystano darmowy limit zapytań na dziś.
            </div>
            
            <div style="margin-bottom: 10px; color: #e2e8f0; font-size: 0.9rem;">
              💳 <b>Wybierz pakiet doładowania:</b><br>
              • <strong>10 zapytań</strong> — 5,00 €<br>
              • <strong>25 zapytań</strong> — 10,00 € <span style="color: #4ade80; font-weight: bold;">(Polecany)</span><br>
              • <strong>60 zapytań</strong> — 20,00 €
            </div>

            <div style="background: #0b1120; border: 1px solid #334155; border-radius: 8px; padding: 10px 12px; margin: 10px 0;">
              <div style="font-size: 0.75rem; color: #94a3b8; text-transform: uppercase; font-weight: 700;">Twój kod zamówienia (pakiet 25 zapytań):</div>
              <div style="font-family: monospace; font-size: 1.1rem; font-weight: 800; color: #4ade80; margin: 4px 0;" class="notranslate">${orderCode25}</div>
              <div style="font-size: 0.78rem; color: #94a3b8;">Dla konta: <b class="notranslate" style="color: #cbd5e1;">${user}</b></div>
            </div>

            <div style="font-size: 0.85rem; color: #cbd5e1; margin-bottom: 12px;">
              📱 Wyślij zgłoszenie na numer <b class="notranslate" style="color: #38bdf8;">+48 600 812 820</b>, aby otrzymać dane do płatności (PayPal / SEPA):
            </div>

            <div style="display: flex; flex-direction: column; gap: 8px;">
              <a href="${waLink25}" target="_blank" style="display: block; text-align: center; background: #22c55e; color: #052e16; padding: 10px; border-radius: 8px; text-decoration: none; font-size: 0.88rem; font-weight: 800;">
                🟢 Zamów 25 zapytań (10 €) przez WhatsApp
              </a>
              <a href="${waLink10}" target="_blank" style="display: block; text-align: center; background: #1e293b; color: #4ade80; padding: 10px; border-radius: 8px; text-decoration: none; font-size: 0.88rem; font-weight: 700; border: 1px solid #4ade80;">
                🟢 Zamów 10 zapytań (5 €) przez WhatsApp
              </a>
              <a href="${smsLink25}" style="display: block; text-align: center; background: #1e293b; color: #fff; padding: 10px; border-radius: 8px; text-decoration: none; font-size: 0.85rem; font-weight: 700; border: 1px solid #475569;">
                💬 Wyślij kod SMS-em (+48 600 812 820)
              </a>
            </div>

            <small style="color: #94a3b8; display: block; margin-top: 10px; font-size: 0.75rem;">
              Po uregulowaniu wpłaty pakiet tokenów zostanie natychmiast przypisany do Twojego konta.
            </small>
          </div>`;
        return;
      }

      if (json.status === "error") {
        wynikDiv.innerHTML = `<div class="odpady-status-msg error">${json.message || 'Błąd wyszukiwania.'}</div>`;
        return;
      }

      if (json.status === "success" && json.terminy && json.terminy.length > 0) {
        let html = `
          <div class="odpady-result-box">
            <div class="odpady-result-title">📅 Najbliższe nadchodzące wywozy:</div>
        `;
        json.terminy.forEach(item => {
          html += `
            <div class="odpady-fraction-item">
              <span class="odpady-fraction-name notranslate">${item.rodzaj}</span>
              <span class="odpady-fraction-date notranslate">${item.data}</span>
            </div>
          `;
        });
        html += `</div>`;
        wynikDiv.innerHTML = html;
      } else {
        wynikDiv.innerHTML = `<div class="odpady-status-msg warning">Brak nadchodzących terminów.</div>`;
      }
    } catch (err) {
      console.error(err);
      wynikDiv.innerHTML = `<div class="odpady-status-msg error">Błąd połączenia z bazą.</div>`;
    }
  }

  // LOGIKA TŁUMACZA GOOGLE
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'pl',
      autoDisplay: true
    }, 'google_translate_element');

    // Pobranie języka przeglądarki użytkownika
    const userLang = (navigator.language || navigator.userLanguage).substring(0, 2);
    
    // Jeśli język nie jest polski, ustaw automatycznie tłumacz
    if (userLang !== 'pl') {
      setTimeout(() => {
        const select = document.querySelector('.goog-te-combo');
        if (select) {
          select.value = userLang;
          select.dispatchEvent(new Event('change'));
        }
      }, 800);
    }
  }
</script>

<!-- Skrypt Google Translate włączany na końcu -->
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
