<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zestaw Tygodniowy - Skonfiguruj swój pakiet</title>

    <style>
        /* --- ZABEZPIECZENIE PRZED KOPIOWANIEM I BAZOWE TŁO --- */
        body {
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .main-content {
            flex-grow: 1;
            width: 100%;
        }

        /* UKRYCIE ZAWARTOŚCI STRONY NA CZAS ŁADOWANIA */
        #pageWrapper {
            opacity: 0;
            transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            pointer-events: none;
        }

        #pageWrapper.loaded {
            opacity: 1;
            pointer-events: auto;
        }

        /* PEŁNOEKRANOWA NAKŁADKA POWITALNA (SPLASH SCREEN) */
        #splashOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #1b2838 0%, #0a0e14 100%);
            z-index: 999999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #splashOverlay.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .splash-card {
            width: 90%;
            max-width: 480px;
            background: rgba(18, 18, 18, 0.85);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 35px rgba(46, 204, 113, 0.35), 0 20px 50px rgba(0,0,0,0.9);
            border: 1px solid rgba(46, 204, 113, 0.5);
            backdrop-filter: blur(12px);
            text-align: center;
            animation: floatCard 4s ease-in-out infinite;
        }

        @keyframes floatCard {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .splash-video-box {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
            background: #000;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        .splash-video-box img, .splash-video-box video {
            width: 100%;
            height: auto;
            display: block;
        }

        .splash-title {
            color: #2ecc71;
            font-size: 1.5em;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin: 18px 0 8px 0;
            text-shadow: 0 0 10px rgba(46, 204, 113, 0.4);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .splash-desc {
            color: #bbb;
            font-size: 0.95em;
            line-height: 1.5;
            margin: 0 0 15px 0;
        }

        .splash-spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(46, 204, 113, 0.2);
            border-top: 3px solid #2ecc71;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto;
        }

        input, textarea, select {
            -webkit-user-select: text !important;
            -moz-user-select: text !important;
            -ms-user-select: text !important;
            user-select: text !important;
        }

        /* STYLIZACJA KONTENERA (Dark Mode) */
        .harmonogram-wrapper {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: transparent;
            color: #e0e0e0;
            width: 100%;
            margin: 0;
            padding: 0;
            line-height: 1.6;
            box-sizing: border-box;
        }

        /* NAGŁÓWKI */
        .harmonogram-wrapper h2 {
            color: #2ecc71;
            border-bottom: 2px solid #27ae60;
            padding-bottom: 5px;
            margin-top: 10px;
            margin-bottom: 20px;
            font-size: 1.5em;
            text-transform: uppercase;
            font-weight: 800;
            line-height: 1.3;
            text-align: center;
        }

        .info-text { font-size: 0.95em; margin-bottom: 15px; color: #ccc; text-align: center; }
        .benefit-list { list-style: none !important; padding: 0 !important; margin: 0; }
        .benefit-list li { margin-bottom: 10px; padding-left: 25px !important; position: relative; font-size: 0.95em; line-height: 1.4; }
        .benefit-list li::before { content: "\2714"; position: absolute; left: 0; top: 0; color: #4ca1af; font-weight: bold; }

        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* KAFELEK STRATEGII */
        .strategy-container { display: flex;
            flex-wrap: wrap; gap: 15px; margin-bottom: 30px; justify-content: center; align-items: stretch; width: 100%; }
        .strategy-card { flex: 1 1 100%; max-width: 800px; background: rgba(255, 255, 255, 0.05); border-radius: 10px;
            padding: 25px; border: 1px solid #4ca1af; border-top: 4px solid #2ecc71; position: relative; display: flex; flex-direction: column; transition: transform 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2); box-sizing: border-box; }
        .strategy-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.3); }
        .strategy-title { font-size: 1.3em; font-weight: 600; margin-bottom: 5px; text-transform: uppercase; text-align: center; color: #bbb; }
        .price-tag-large { font-size: 1.8em; font-weight: 900; text-align: center; margin: 5px 0; color: #2ecc71;
            text-shadow: 0 0 15px rgba(46, 204, 113, 0.2); }
        .price-subtitle-small { display: block; font-size: 0.9em; color: #ccc;
            font-style: italic; text-align: center; margin-bottom: 20px; }

        .strategy-list { list-style: none !important; padding: 0 !important; margin: 0; font-size: 0.95em; }
        .strategy-list li { margin-bottom: 8px; padding-left: 25px !important; position: relative; line-height: 1.4; }
        .strategy-list li::before { content: "\2714"; position: absolute; left: 0; top: 0; color: #2ecc71; }

        /* DUAL FORMAT INFO */
        .format-columns { display: flex; flex-direction: column; gap: 15px;
            margin: 0 auto 20px auto; width: fit-content; box-sizing: border-box; }
        .format-col { background: rgba(0,0,0,0.2); padding: 15px 25px;
            border-radius: 8px; box-sizing: border-box; width: 100%; word-break: break-word; text-align: left; }
        .format-col-pdf { border-left: 4px solid #e74c3c; }
        .format-col-jpg { border-left: 4px solid #f39c12; }
        .format-col-online { border-left: 4px solid #3498db; }

        /* FORMULARZ */
        .form-wrapper { background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); padding: 20px;
            border-radius: 10px; margin-top: 20px; border: 1px solid #4ca1af; box-shadow: 0 4px 15px rgba(0,0,0,0.3); box-sizing: border-box; max-width: 800px; margin-left: auto; margin-right: auto; }
        .form-header { text-align: center; color: #fff; margin-bottom: 10px; margin-top: 20px; font-weight: bold; font-size: 1.1em;
            border-top: 1px solid rgba(255,255,255,0.1); padding-top: 15px; }
        .form-header:first-child { border-top: none; margin-top: 0; padding-top: 0; }
        
        .regions-scroll-box { position: relative; min-height: 150px; max-height: 250px; overflow-y: scroll;
            background: rgba(0, 0, 0, 0.3); border: 1px solid #4ca1af; border-radius: 5px; padding: 10px; margin: 0 auto 15px auto; text-align: left;
            transition: opacity 0.3s ease; box-sizing: border-box; width: 100%; max-width: 800px; }

        .regions-scroll-box::-webkit-scrollbar { width: 8px; }
        .regions-scroll-box::-webkit-scrollbar-track { background: #1a1a1a; }
        .regions-scroll-box::-webkit-scrollbar-thumb { background: #4ca1af; border-radius: 4px; }
        
        /* NAKŁADKA ŁADOWANIA W RAMCE (OVERLAY) */
        .pro-loader-overlay { position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(2px); z-index: 10; display: flex;
            flex-direction: column; align-items: center; justify-content: center; color: #2ecc71; font-weight: bold; text-align: center; border-radius: 4px; transition: opacity 0.3s ease; }
        .pro-spinner { width: 40px; height: 40px; border: 4px solid rgba(46, 204, 113, 0.2); border-left-color: #2ecc71;
            border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }

        .region-label { display: block; padding: 5px;
            cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.05); color: #ddd; font-size: 0.9em; transition: opacity 0.3s ease; }
        .region-label:hover { background: rgba(255,255,255,0.1); }
        .region-label input[type="checkbox"], .region-label input[type="radio"] { margin-right: 10px;
            transform: scale(1.2); }
        
        .selection-tools { display: flex; justify-content: flex-end; align-items: center; margin-bottom: 10px; font-size: 0.95em; max-width: 800px; margin-left: auto; margin-right: auto; }
        .selection-tools a { color: #4ca1af; text-decoration: none; cursor: pointer; padding: 5px; user-select: none; }
        .selection-tools a:hover { color: #fff; text-decoration: underline; }

        /* OPCJE DODATKOWE & PŁATNOŚĆ */
        .extra-options-group { background: rgba(0, 0, 0, 0.2);
            border: 1px dashed #f1c40f; border-radius: 8px; padding: 5px; margin-bottom: 10px; box-sizing: border-box; }
        .option-box { padding: 4px;
            margin-bottom: 2px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .option-box:last-child { border-bottom: none; margin-bottom: 0; }
        .extra-options-group .region-label { padding: 4px 5px; margin: 0; font-size: 0.88em; }

        .client-input { width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 5px; border: 1px solid #4ca1af; background: rgba(255,255,255,0.9);
            color: #333; font-size: 1em; box-sizing: border-box; transition: all 0.3s ease; }

        .submit-btn { width: 100%;
            background: linear-gradient(90deg, #e74c3c 0%, #c0392b 100%); color: white; padding: 15px; border: none; border-radius: 5px; font-size: 1.1em; font-weight: bold; cursor: pointer;
            text-transform: uppercase; transition: transform 0.3s; margin-top: 10px; box-sizing: border-box; }
        .submit-btn:hover { transform: scale(1.02); }
        
        .hidden { display: none !important; }

        /* RWD */
        @media (max-width: 768px) {
            .harmonogram-wrapper { font-size: 1.05em; }
            .region-label { padding: 12px 5px; font-size: 1.1em; }
            .submit-btn { padding: 18px; font-size: 1.2em; }
            .format-columns { width: 100%; } 
            .strategy-card { padding: 15px; } 
        }

        @media (min-width: 1024px) {
            .harmonogram-wrapper { font-size: 1.15em; }
            .strategy-title { font-size: 1.5em; }
            .price-tag-large { font-size: 2.2em; }
            .submit-btn { font-size: 1.3em; padding: 20px; letter-spacing: 1px; }
            .region-label { font-size: 1.05em; padding: 8px 5px; }
            .form-header { font-size: 1.3em; margin-bottom: 15px; margin-top: 25px; }
            .client-input { font-size: 1.1em; padding: 15px; }
        }

        /* STOPKA */
        .dabu-footer {
            background-color: #121212;
            border-top: 1px solid #333;
            color: #ccc;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 50px 20px 20px;
            width: 100%;
            box-sizing: border-box;
            margin-top: 40px;
        }

        .dabu-footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            justify-content: space-between;
        }

        .dabu-footer-col {
            flex: 1;
            min-width: 280px;
            text-align: left;
        }

        .dabu-footer-heading {
            color: #2ecc71;
            font-size: 1.3em;
            margin-top: 0;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dabu-footer-text {
            font-size: 0.9em;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .dabu-footer-links, .dabu-footer-contact {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 0.9em;
            line-height: 1.8;
        }

        .dabu-footer-links li a, .dabu-footer-contact li a {
            color: #3498db;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .dabu-footer-links li a:hover, .dabu-footer-contact li a:hover {
            color: #2ecc71;
            text-decoration: underline;
        }

        .dabu-footer-contact li {
            margin-bottom: 8px;
            color: #aaa;
        }

        .dabu-footer-contact strong {
            color: #e0e0e0;
        }

        .dabu-footer-bottom {
            max-width: 1200px;
            margin: 40px auto 0;
            padding-top: 20px;
            border-top: 1px solid #222;
            text-align: center;
            font-size: 0.85em;
            color: #777;
        }

        .dabu-footer-bottom a {
            color: #2ecc71;
            text-decoration: none;
            font-weight: bold;
        }

        .dabu-footer-bottom a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .dabu-footer {
                padding: 40px 15px 15px;
            }
            .dabu-footer-container {
                flex-direction: column;
                gap: 30px;
            }
            .dabu-footer-col {
                text-align: center;
            }
        }
    </style>
</head>
